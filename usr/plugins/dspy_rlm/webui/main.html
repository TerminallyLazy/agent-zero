<html>
  <head>
    <title>A0 Self-Improvement</title>
    <script type="module">
    import { store } from "/plugins/dspy_rlm/webui/dspy-rlm-store.js?v=102";
    </script>
  </head>
  <body>
    <div x-data x-init="$store.dspyRlm.initRuntime()" x-destroy="$store.dspyRlm.stopAutoRefresh()">
      <template x-if="!$store.dspyRlm.statusLoaded">
        <div class="plugin-page-loading">
          <div class="loading-orbit" aria-hidden="true"></div>
          <p class="loading-title">Reading the learning system</p>
          <p class="loading-copy">Resolving context, workers, evidence, and optimization state.</p>
          <template x-if="$store.dspyRlm.lastError">
            <div class="plugin-error" x-text="$store.dspyRlm.lastError"></div>
          </template>
          <div class="loading-actions">
            <button class="btn btn-field" @click="$store.dspyRlm.refreshStatus({force:true})">
              Retry
            </button>
            <button class="btn btn-field" @click="$store.dspyRlm.openConfig()">
              Open settings
            </button>
          </div>
        </div>
      </template>

      <template x-if="$store.dspyRlm.statusLoaded">
        <section class="dspy-rlm-shell">
          <header class="dspy-rlm-header">
            <div class="brand-lockup">
              <div class="brand-mark" aria-hidden="true">
                <img src="/plugins/dspy_rlm/webui/thumbnail.png" alt="" />
              </div>
              <div>
                <p class="kicker">Agent Zero learning system</p>
                <h1>A0 <span>Self-Improvement</span></h1>
                <p class="header-deck">DSPy GEPA optimization and bounded RLM evidence analysis for this context.</p>
              </div>
            </div>
            <div class="header-actions">
              <button class="btn btn-field" @click="$store.dspyRlm.refreshStatus({ force: true })" :disabled="$store.dspyRlm.loading">
                <span x-text="$store.dspyRlm.loading ? 'Syncing...' : 'Sync status'"></span>
              </button>
              <button class="btn btn-field is-primary" @click="$store.dspyRlm.openConfig()">Configure</button>
            </div>
          </header>

          <section class="status-band">
            <label class="context-control">
              <span>Context</span>
              <input
                x-model="$store.dspyRlm.contextId"
                placeholder="Current context id"
                @change="$store.dspyRlm.setContextId()"
              />
            </label>
            <div class="badge-strip">
              <span class="status-badge" :class="$store.dspyRlm.optimizationClass" x-text="$store.dspyRlm.optimizationStatus"></span>
              <span class="status-badge" :class="$store.dspyRlm.dependencyStateClass" x-text="$store.dspyRlm.dependenciesLabel"></span>
              <span class="status-badge is-muted" x-text="$store.dspyRlm.objectiveModeLabel"></span>
            </div>
          </section>

          <section class="dspy-rlm-grid">
            <div class="dashboard-column dashboard-column--primary">
            <article class="panel">
              <h2>Improvement cycle</h2>
              <div class="metric-grid">
                <div>
                  <p class="metric-label">Auto optimization</p>
                  <p class="metric-value" x-text="$store.dspyRlm.autoOptimizeLabel"></p>
                </div>
                <div>
                  <p class="metric-label">Attempts</p>
                  <p class="metric-value" x-text="$store.dspyRlm.totalAttempts"></p>
                </div>
                <div>
                  <p class="metric-label">Since optimize</p>
                  <p class="metric-value" x-text="$store.dspyRlm.attemptsSinceOptimization"></p>
                </div>
                <div>
                  <p class="metric-label">Cooldown</p>
                  <p class="metric-value" x-text="$store.dspyRlm.cooldownLabel"></p>
                </div>
              </div>
              <p class="panel-note">
                <span class="note-title">Auto-schedule readiness:</span>
                <span x-text="$store.dspyRlm.objectiveReadiness.label"></span>
              </p>
              <p class="panel-note">
                <span class="note-title">Mode:</span>
                <span x-text="$store.dspyRlm.optimizationMode"></span>
              </p>
              <div class="actions-row">
                <button
                  class="btn btn-field"
                  @click="$store.dspyRlm.runOptimize()"
                  :disabled="$store.dspyRlm.actionInFlight">
                  <span x-text="$store.dspyRlm.actionInFlight ? 'Running…' : 'Run optimize now'"></span>
                </button>
                <span class="small-note" x-text="$store.dspyRlm.configuredRefreshLabel"></span>
              </div>
              <template x-if="$store.dspyRlm.statusMessage">
                <p class="status-message" x-text="$store.dspyRlm.statusMessage"></p>
              </template>
            </article>

            <article class="panel">
              <h2>Evidence signal</h2>
              <div class="metric-grid">
                <div>
                  <p class="metric-label">Events</p>
                  <p class="metric-value" x-text="$store.dspyRlm.traceSummary.event_count"></p>
                </div>
                <div>
                  <p class="metric-label">Loops</p>
                  <p class="metric-value" x-text="$store.dspyRlm.traceSummary.loop_count"></p>
                </div>
                <div>
                  <p class="metric-label">Tools</p>
                  <p class="metric-value" x-text="$store.dspyRlm.traceSummary.tool_count"></p>
                </div>
                <div>
                  <p class="metric-label">Success</p>
                  <p class="metric-value" x-text="$store.dspyRlm.formatPercent($store.dspyRlm.traceSummary.success_rate)"></p>
                </div>
              </div>
              <div class="meter">
                <div class="meter-fill" :style="`width: ${$store.dspyRlm.formatPercent($store.dspyRlm.traceSummary.success_rate)}`"></div>
              </div>
              <div class="panel-note">
                Telemetry is summarized metadata only. Tool labels and counts appear in Top tools.
              </div>
            </article>

            <article class="panel">
              <h2>Worker pool</h2>
              <div class="metric-grid">
                <div>
                  <p class="metric-label">Mode</p>
                  <p class="metric-value" x-text="$store.dspyRlm.schedulerMode"></p>
                </div>
                <div>
                  <p class="metric-label">Workers</p>
                  <p class="metric-value" x-text="$store.dspyRlm.schedulerWorkersLabel"></p>
                </div>
                <div>
                  <p class="metric-label">Queued</p>
                  <p class="metric-value" x-text="$store.dspyRlm.jobCounts.queued"></p>
                </div>
                <div>
                  <p class="metric-label">Running</p>
                  <p class="metric-value" x-text="$store.dspyRlm.jobCounts.running"></p>
                </div>
              </div>
              <p class="panel-note">
                <span class="note-title">Health:</span>
                <span x-text="$store.dspyRlm.schedulerHealth"></span>
              </p>
              <p class="panel-note">Workers are local processes sharing this host's SQLite store. This is not multi-host distributed scheduling.</p>
            </article>
            </div>

            <div class="dashboard-column dashboard-column--secondary">
            <article class="panel">
              <h2>Quality gates</h2>
              <template x-if="$store.dspyRlm.matrixSummary.length">
                <div class="tool-list">
                  <template x-for="metric in $store.dspyRlm.matrixSummary" :key="metric.label">
                    <div class="result-field">
                      <span x-text="metric.label"></span>
                      <span
                        class="status-badge status-badge--muted"
                        :class="$store.dspyRlm.matrixScoreClass(metric.score)"
                        x-text="metric.scoreLabel"
                      ></span>
                      <span style="color: var(--dspy-text-soft)" x-text="`samples: ${metric.count}`"></span>
                    </div>
                  </template>
                </div>
              </template>
              <template x-if="!$store.dspyRlm.matrixSummary.length">
                <p class="panel-note">Validation metrics are not available until guidance has been evaluated.</p>
              </template>
            </article>

            <article class="panel">
              <h2>Active guidance</h2>
              <div class="guidance-state">
                <p>
                  <span class="note-title">Current guidance:</span>
                  <span x-text="$store.dspyRlm.lastGuidance ? 'active' : 'pending'"></span>
                </p>
                <p><span class="note-title">Updated:</span> <span x-text="$store.dspyRlm.lastGuidanceDate"></span></p>
              </div>
              <p class="guidance-block" x-text="$store.dspyRlm.lastGuidance || 'No compiled guidance has been produced yet.'"></p>
            </article>

            <article class="panel">
              <h2>Tool patterns</h2>
              <template x-if="$store.dspyRlm.hasRecentEvents()">
                <div class="tool-list">
                  <template x-for="item in $store.dspyRlm.latestToolRows()" :key="item.toolName">
                    <div class="tool-row">
                      <div class="tool-row-head">
                        <span class="tool-row-name" x-text="item.toolName"></span>
                        <span class="tool-row-count" x-text="item.count"></span>
                      </div>
                      <div class="tool-row-meter-wrap">
                        <div class="tool-row-meter-fill" :style="`width: ${item.width}`"></div>
                      </div>
                    </div>
                  </template>
                </div>
              </template>
              <template x-if="!$store.dspyRlm.hasRecentEvents()">
                <p class="panel-note">No tool telemetry in the selected context yet.</p>
              </template>
            </article>
            </div>
          </section>

          <article class="panel panel-full">
            <h2>Latest run</h2>
            <template x-if="$store.dspyRlm.lastOptimizationResult">
              <div class="result-grid">
                <p class="result-field"><span>Status:</span> <strong x-text="$store.dspyRlm.lastOptimizationResult.status || '—'"></strong></p>
                <p class="result-field"><span>Reason:</span> <span x-text="$store.dspyRlm.lastOptimizationResult.reason || '—'"></span></p>
                <p class="result-field"><span>Error:</span> <span x-text="$store.dspyRlm.lastOptimizationResult.error || '—'"></span></p>
                <p class="result-field"><span>Guidance length:</span>
                  <span x-text="`${$store.dspyRlm.lastOptimizationResult.guidance?.length || 0} chars`"></span>
                </p>
              </div>
            </template>
            <template x-if="!$store.dspyRlm.lastOptimizationResult">
              <p class="panel-note">No manual run has been executed in this session yet.</p>
            </template>
          </article>

          <template x-if="$store.dspyRlm.lastError">
            <div class="plugin-error" x-text="$store.dspyRlm.lastError"></div>
          </template>
        </section>
      </template>
    </div>

    <style>
      :root {
        --dspy-bg-grad: linear-gradient(140deg, #0f1020, #111a2b 40%, #12121b 100%);
        --dspy-panel: rgba(255, 255, 255, 0.05);
        --dspy-panel-border: rgba(255, 255, 255, 0.14);
        --dspy-text-soft: rgba(255, 255, 255, 0.76);
        --dspy-success: #56d39a;
        --dspy-warning: #f4b35f;
        --dspy-danger: #ff7b7b;
      }

      .dspy-rlm-shell {
        color: #f4f7ff;
        background: var(--dspy-bg-grad);
        padding: 14px;
        border-radius: 12px;
        border: 1px solid var(--dspy-panel-border);
      }

      .dspy-rlm-header {
        display: flex;
        justify-content: space-between;
        gap: 16px;
        align-items: flex-start;
        margin-bottom: 14px;
      }

      .dspy-rlm-header h1 {
        margin: 0;
        font-size: 1.65rem;
      }

      .kicker {
        font-size: 0.66rem;
        letter-spacing: 0.13em;
        text-transform: uppercase;
        color: var(--dspy-text-soft);
      }

      .header-actions {
        display: flex;
        gap: 8px;
        align-items: center;
      }

      .status-band {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        margin-bottom: 14px;
        padding: 10px;
        border: 1px solid var(--dspy-panel-border);
        border-radius: 10px;
        background: rgba(17, 20, 34, 0.6);
      }

      .context-control {
        display: inline-flex;
        flex-direction: column;
        gap: 6px;
        font-size: 0.8rem;
      }

      .context-control span {
        color: var(--dspy-text-soft);
      }

      .context-control input {
        min-width: 340px;
        padding: 8px 10px;
        border-radius: 10px;
        border: 1px solid var(--dspy-panel-border);
        color: #fff;
        background: rgba(255, 255, 255, 0.06);
      }

      .badge-strip {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }

      .status-badge {
        font-size: 0.78rem;
        padding: 5px 10px;
        border-radius: 999px;
        border: 1px solid var(--dspy-panel-border);
        color: var(--dspy-text-soft);
      }

      .status-badge.is-ok,
      .status-badge.status-badge--ok {
        background: rgba(86, 211, 154, 0.15);
        border-color: rgba(86, 211, 154, 0.4);
        color: #cbffdf;
      }

      .status-badge.is-run,
      .status-badge.status-badge--running {
        background: rgba(244, 179, 95, 0.15);
        border-color: rgba(244, 179, 95, 0.4);
        color: #ffe7be;
      }

      .status-badge.is-bad,
      .status-badge.status-badge--danger {
        background: rgba(255, 123, 123, 0.15);
        border-color: rgba(255, 123, 123, 0.4);
        color: #ffd4d4;
      }

      .status-badge.status-badge--warn {
        background: rgba(244, 179, 95, 0.1);
        border-color: rgba(244, 179, 95, 0.3);
        color: #ffe2b0;
      }

      .status-badge.status-badge--muted {
        color: #d5ddff;
        border-color: var(--dspy-panel-border);
        background: rgba(255, 255, 255, 0.04);
      }

      .status-badge.is-muted {
        color: #d5ddff;
      }

      .dspy-rlm-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
        gap: 12px;
      }

      .panel {
        padding: 12px;
        border-radius: 12px;
        border: 1px solid var(--dspy-panel-border);
        background: var(--dspy-panel);
        display: flex;
        flex-direction: column;
        gap: 10px;
      }

      .panel h2 {
        margin: 0;
        font-size: 1rem;
      }

      .panel-full {
        margin-top: 12px;
      }

      .metric-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(80px, 1fr));
        gap: 8px;
      }

      .metric-label {
        margin: 0;
        color: var(--dspy-text-soft);
        font-size: 0.77rem;
      }

      .metric-value {
        margin: 0;
        font-weight: 700;
        font-size: 1.2rem;
      }

      .panel-note {
        margin: 0;
        font-size: 0.82rem;
        color: #e8ecff;
        display: flex;
        gap: 6px;
      }

      .note-title {
        color: var(--dspy-text-soft);
      }

      .actions-row {
        display: inline-flex;
        gap: 8px;
        align-items: center;
        flex-wrap: wrap;
      }

      .small-note {
        font-size: 0.8rem;
        color: var(--dspy-text-soft);
      }

      .status-message {
        margin: 0;
        font-size: 0.83rem;
        color: #d6ffe0;
      }

      .meter {
        margin-top: 4px;
        width: 100%;
        height: 8px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.08);
        overflow: hidden;
      }

      .meter-fill {
        width: 0;
        height: 100%;
        border-radius: 999px;
        background: linear-gradient(to right, #ff8f70, #56d39a);
        transition: none;
      }

      .guidance-state {
        display: flex;
        gap: 12px;
        flex-wrap: wrap;
        font-size: 0.8rem;
        color: #e8ecff;
      }

      .guidance-state p {
        margin: 0;
      }

      .guidance-block {
        margin: 0;
        padding: 10px;
        border-radius: 10px;
        font-size: 0.82rem;
        line-height: 1.4;
        white-space: pre-wrap;
        background: rgba(17, 21, 35, 0.65);
      }

      .tool-list {
        display: grid;
        gap: 8px;
      }

      .tool-row {
        display: grid;
        gap: 4px;
      }

      .tool-row-head {
        display: flex;
        justify-content: space-between;
        font-size: 0.82rem;
      }

      .tool-row-name {
        color: #edf2ff;
      }

      .tool-row-count {
        color: #b4bde0;
      }

      .tool-row-meter-wrap {
        width: 100%;
        height: 7px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.08);
        overflow: hidden;
      }

      .tool-row-meter-fill {
        height: 100%;
        width: 0;
        border-radius: 999px;
        background: linear-gradient(to right, #82b6ff, #56d39a);
      }

      .result-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
        gap: 8px 14px;
      }

      .result-field {
        margin: 0;
        font-size: 0.82rem;
      }

      .result-field span {
        color: var(--dspy-text-soft);
      }

      .plugin-page-loading {
        padding: 8px 0;
      }

      .loading-actions {
        display: flex;
        gap: 8px;
        align-items: center;
      }

      .plugin-error {
        margin-top: 6px;
        padding: 8px 10px;
        border-radius: 8px;
        color: #ffdad6;
        background: #4f1d1d;
        border: 1px solid #7a2727;
      }
    </style>
    <link rel="stylesheet" href="/plugins/dspy_rlm/webui/dspy-rlm-polish.css?v=101" />
  </body>
</html>
