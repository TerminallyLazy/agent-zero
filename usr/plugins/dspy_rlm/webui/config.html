        config.matrix.tool_retrieval.evidence_recall_hard_fail = toFloat(config.matrix.tool_retrieval.evidence_recall_hard_fail, 0.50, 0, 1);

        config.matrix.tool_retrieval.evidence_precision_threshold = toFloat(config.matrix.tool_retrieval.evidence_precision_threshold, 0.80, 0, 1);
        config.matrix.tool_retrieval.evidence_precision_hard_fail = toFloat(config.matrix.tool_retrieval.evidence_precision_hard_fail, 0.55, 0, 1);
        config.matrix.tool_retrieval.semantic_match_weight = toFloat(config.matrix.tool_retrieval.semantic_match_weight, 0.20, 0, 1);
        config.matrix.tool_retrieval.semantic_match_threshold = toFloat(config.matrix.tool_retrieval.semantic_match_threshold, 0.70, 0, 1);

        config.matrix.reasoning.answer_quality_threshold = toFloat(config.matrix.reasoning.answer_quality_threshold, 0.80, 0, 1);
        config.matrix.reasoning.answer_quality_hard_fail = toFloat(config.matrix.reasoning.answer_quality_hard_fail, 0.65, 0, 1);
        config.matrix.reasoning.policy_compliance_weight = toFloat(config.matrix.reasoning.policy_compliance_weight, 0.40, 0, 1);
        config.matrix.reasoning.policy_compliance_threshold = toFloat(config.matrix.reasoning.policy_compliance_threshold, 1, 0, 1);
        config.matrix.reasoning.policy_compliance_hard_fail = toFloat(config.matrix.reasoning.policy_compliance_hard_fail, 1, 0, 1);
        config.matrix.reasoning.semantic_match_weight = toFloat(config.matrix.reasoning.semantic_match_weight, 0.20, 0, 1);
        config.matrix.reasoning.semantic_match_threshold = toFloat(config.matrix.reasoning.semantic_match_threshold, 0.72, 0, 1);

        config.matrix.decision_making.enabled = toBool(config.matrix.decision_making.enabled, true);
        config.matrix.decision_making.policy_compliance_weight = toFloat(config.matrix.decision_making.policy_compliance_weight, 1.0, 0, 1);
        config.matrix.decision_making.policy_compliance_threshold = toFloat(config.matrix.decision_making.policy_compliance_threshold, 1.0, 0, 1);
        config.matrix.decision_making.policy_compliance_hard_fail = toFloat(config.matrix.decision_making.policy_compliance_hard_fail, 1.0, 0, 1);
        config.matrix.decision_making.semantic_match_weight = toFloat(config.matrix.decision_making.semantic_match_weight, 0.30, 0, 1);
        config.matrix.decision_making.semantic_match_threshold = toFloat(config.matrix.decision_making.semantic_match_threshold, 0.75, 0, 1);
        config.matrix.decision_making.semantic_match_hard_fail = toFloat(config.matrix.decision_making.semantic_match_hard_fail, 0.55, 0, 1);
        config.matrix.decision_making.answer_quality_weight = toFloat(config.matrix.decision_making.answer_quality_weight, 0.35, 0, 1);
        config.matrix.decision_making.answer_quality_threshold = toFloat(config.matrix.decision_making.answer_quality_threshold, 0.70, 0, 1);
        config.matrix.decision_making.answer_quality_hard_fail = toFloat(config.matrix.decision_making.answer_quality_hard_fail, 0.50, 0, 1);

        config.evaluator = ensureObject(config.evaluator, {
          enable_semantic_judge: true,

          semantic_loop_batch_size: 8,

          enable_replay_audit: true,
          max_replay_depth: 6,

        config.evaluator.enable_semantic_judge = toBool(config.evaluator.enable_semantic_judge, true);
        config.evaluator.preferred_dspy_model = toText(config.evaluator.preferred_dspy_model, '');
        config.evaluator.semantic_loop_batch_size = toInt(config.evaluator.semantic_loop_batch_size, 8, 1, 64);
        config.evaluator.risk_threshold = toFloat(config.evaluator.risk_threshold, 0.25, 0, 1);
        config.evaluator.enable_replay_audit = toBool(config.evaluator.enable_replay_audit, true);
        config.evaluator.max_replay_depth = toInt(config.evaluator.max_replay_depth, 6, 1, 20);

        if (!config.evaluator.policy_breach_keywords.length) {
          config.evaluator.policy_breach_keywords = [
            'forbidden',
            'delete production',
            'drop table',
            'rm -rf /',
            'exfiltrate',
            'secret',
            'pwn',
            'overwrite backups',
            'disable auth',
          ];
        }

        config.prompt = ensureObject(config.prompt, {
          inject_guidance: true,
          inject_even_without_guidance: true,
          max_injected_chars: 1800,
          fallback_guidance: 'Use concise, evidence-driven reasoning and prioritize safe, auditable actions.',
        });
        config.prompt.inject_guidance = toBool(config.prompt.inject_guidance, true);
        config.prompt.inject_even_without_guidance = toBool(config.prompt.inject_even_without_guidance, true);
        config.prompt.max_injected_chars = toInt(config.prompt.max_injected_chars, 1800, 128, 30000);
        config.prompt.fallback_guidance = toText(config.prompt.fallback_guidance, 'Use concise, evidence-driven reasoning and prioritize safe, auditable actions.');

        config.dependencies = ensureObject(config.dependencies, {
          install_mode: 'isolated_worker',
          dependency_file: 'requirements.txt',
          fallback_to_pip: false,
          ensure_at_startup: true,
          install_timeout_seconds: 115,
        });
        config.dependencies.install_mode = toText(config.dependencies.install_mode, 'isolated_worker');
        config.dependencies.dependency_file = toText(config.dependencies.dependency_file, 'requirements.txt');
        config.dependencies.fallback_to_pip = toBool(config.dependencies.fallback_to_pip, false);
        config.dependencies.ensure_at_startup = toBool(config.dependencies.ensure_at_startup, true);
        config.dependencies.install_timeout_seconds = toInt(config.dependencies.install_timeout_seconds, 115, 15, 1800);

        $watch(() => config.scheduler_mode, (value) => {
          scheduler.mode = toText(value, 'distributed').toLowerCase();
        });
        $watch(() => config.scheduler_max_workers, (value) => {
          scheduler.max_workers = toInt(value, 2, 1, 64);
        });
        $watch(() => config.scheduler_poll_interval_seconds, (value) => {
          scheduler.poll_interval_seconds = toInt(value, 3, 1, 300);
        });
        $watch(() => config.scheduler_job_lease_seconds, (value) => {
          scheduler.job_lease_seconds = toInt(value, 45, 10, 2000);
        });
        $watch(() => config.scheduler_max_retries, (value) => {
          scheduler.max_retries = toInt(value, 2, 0, 50);
        });
        $watch(() => config.scheduler_heartbeat_seconds, (value) => {
          scheduler.heartbeat_seconds = toInt(value, 8, 2, 120);
        });
        $watch(() => config.scheduler_stale_worker_seconds, (value) => {
          scheduler.stale_worker_seconds = toInt(value, 180, 20, 3600);
        });
        $watch(() => config.scheduler_lock_ttl_seconds, (value) => {
          scheduler.scheduler_lock_ttl_seconds = toInt(value, 30, 10, 600);
        });
        $watch(() => config.scheduler_backoff_base_seconds, (value) => {
          scheduler.backoff_base_seconds = toInt(value, 2, 1, 120);
        });
        $watch(() => config.scheduler_enforce_single_tenant_per_context, (value) => {
          scheduler.enforce_single_tenant_per_context = toBool(value, false);
        });

        $watch(() => config.auto_optimize_enabled, (value) => {
          const optimizationSection = ensureOptimizationSection();
          optimizationSection.auto_optimize = toBool(value, false);
        });
        $watch(() => config.gepa_steps, (value) => {
          const mapped = toInt(value, 3, 1, 128);
          const optimizationSection = ensureOptimizationSection();
          optimizationSection.ge_pa_steps = mapped;
          optimizationSection.gepa_steps = mapped;
        });
        $watch(() => config.gepa_threads, (value) => {
          const mapped = toInt(value, 2, 1, 64);
          const optimizationSection = ensureOptimizationSection();
          optimizationSection.ge_pa_threads = mapped;
          optimizationSection.gepa_threads = mapped;
        });
        $watch(() => config.optimization_trace_window, (value) => {
          const traceCaptureSection = ensureTraceCaptureSection();
          traceCaptureSection.max_events_per_context = toInt(value, config.optimization_trace_window, 10, 2000000);
        });
        $watch(() => config.optimization_preview_limit, (value) => {
          const optimizationSection = ensureOptimizationSection();
          optimizationSection.optimization_preview_limit = toInt(value, 20, 10, 10000);
        });
      "
    >
      <template x-if="config && typeof config === 'object'">
        <section class="dspy-config-shell">
          <header class="dspy-config-header">
            <div>
              <p class="dspy-eyebrow">A0 SELF-IMPROVEMENT</p>
              <h1>Learning Controls</h1>
              <p class="dspy-subtitle">
                Configure evidence capture, RLM analysis, GEPA optimization, quality gates, and managed workers from one screen.
              </p>
            </div>
            <div class="dspy-header-actions">
              <span class="dspy-status-pill" :class="config.enabled ? 'is-on' : 'is-off'" x-text="config.enabled ? 'Runtime: On' : 'Runtime: Off'"></span>
              <span class="dspy-status-pill" x-text="config.scheduler_mode === 'single' ? 'Single worker' : 'Multiprocess'"></span>
            </div>
          </header>

          <section class="dspy-presets">
            <button type="button" class="dspy-btn" @click="applyPreset('safe')">Safe</button>
            <button type="button" class="dspy-btn is-strong" @click="applyPreset('balanced')">Balanced</button>
            <button type="button" class="dspy-btn" @click="applyPreset('aggressive')">Aggressive</button>
          </section>

          <section class="dspy-grid">
            <div class="dspy-card">
              <h2>Capture & runtime</h2>
              <div class="dspy-field">
                <label>
                  <span>Plugin enabled</span>
                  <label class="toggle"><input type="checkbox" x-model="config.enabled" /><span class="slider"></span></label>
                </label>
              </div>
              <div class="dspy-field">
                <label>
                  <span>Trace instrumentation</span>
                  <label class="toggle"><input type="checkbox" x-model="config.instrumentation_enabled" /><span class="slider"></span></label>
                </label>
              </div>
              <div class="dspy-field">
                <label>
                  <span>Trace capture active</span>
                  <label class="toggle"><input type="checkbox" x-model="config.trace_enabled" /><span class="slider"></span></label>
                </label>
              </div>
              <div class="dspy-field">
                <label>
                  <span>Status refresh (seconds)</span>
                  <input type="number" min="1" max="120" step="1" x-model.number="config.status_refresh_seconds" />
                </label>
                <small>UI polling interval while browsing status.</small>
              </div>
              <div class="dspy-field">
                <label>
                  <span>Trace events per context</span>
                  <input type="number" min="10" step="20" x-model.number="config.trace_capture.max_events_per_context" />
                </label>
                <small>Window size used by optimization traces.</small>
              </div>
              <div class="dspy-field">
                <label>
                  <span>Trace events per loop</span>
                  <input type="number" min="1" step="1" x-model.number="config.trace_capture.max_events_per_loop" />
                </label>
              </div>
              <div class="dspy-field">
                <label>
                  <span>Payload chars per event</span>
                  <input type="number" min="64" step="32" x-model.number="config.trace_capture.max_event_payload_chars" />
                </label>
              </div>
            </div>

            <div class="dspy-card">
              <h2>Optimization cadence</h2>
              <div class="dspy-field">
                <label>
                  <span>Auto optimize</span>
                  <label class="toggle"><input type="checkbox" x-model="config.auto_optimize_enabled" /><span class="slider"></span></label>
                </label>
              </div>
              <div class="dspy-field inline">
                <label>
                  <span>Interval messages</span>
                  <input type="number" min="1" step="1" x-model.number="config.optimization_interval_messages" />
                </label>
                <small>Trigger cadence in loop count.</small>
              </div>
              <div class="dspy-field inline">
                <label>
                  <span>Min samples</span>
                  <input type="number" min="1" step="1" x-model.number="config.optimization_min_samples" />
                </label>
              </div>
              <div class="dspy-field inline">
                <label>
                  <span>Cooldown (hours)</span>
                  <input type="number" min="0" step="1" x-model.number="config.optimization_cooldown_hours" />
                </label>
              </div>
              <div class="dspy-field inline">
                <label>
                  <span>Trace retention window</span>
                  <input type="number" min="60" step="1" x-model.number="config.optimization_trace_window" />
                </label>
              </div>
              <div class="dspy-field inline">
                <label>
                  <span>Preview limit</span>
                  <input type="number" min="10" step="1" x-model.number="config.optimization_preview_limit" />
                </label>
              </div>
            </div>

            <div class="dspy-card">
              <h2>GEPA optimizer</h2>
              <div class="dspy-field">
                <label>
                  <span>Enable GEPA</span>
                  <label class="toggle"><input type="checkbox" x-model="config.enable_dspy_optimizer" /><span class="slider"></span></label>
                </label>
              </div>
              <div class="dspy-field inline">
                <label>
                  <span>GEPA steps</span>
                  <input type="number" min="1" max="64" step="1" x-model.number="config.gepa_steps" />
                </label>
              </div>
              <div class="dspy-field inline">
                <label>
                  <span>GEPA threads</span>
                  <input type="number" min="1" max="64" step="1" x-model.number="config.gepa_threads" />
                </label>
              </div>
              <div class="dspy-field inline">
                <label>
                  <span>Compile timeout (sec)</span>
                  <input type="number" min="5" max="3600" step="5" x-model.number="config.optimization.max_compile_seconds" />
                </label>
              </div>
              <div class="dspy-field inline">
                <label>
                  <span>Maximum cost (USD)</span>
                  <input type="number" min="0" max="1000" step="0.25" x-model.number="config.optimization.max_cost_usd" />
                </label>
              </div>
              <div class="dspy-field inline">
                <label>
                  <span>Max evaluation batch</span>
                  <input type="number" min="1" max="128" step="1" x-model.number="config.optimization.max_evaluation_batch" />
                </label>
              </div>
              <div class="dspy-field inline">
                <label>
                  <span>Replay size</span>
                  <input type="number" min="1" max="20" step="1" x-model.number="config.replay_set_size" />
                </label>
              </div>
              <div class="dspy-field inline">
                <label>
                  <span>Replay regression tolerance</span>
                  <input type="number" min="0" max="1" step="0.01" x-model.number="config.replay_tolerable_regression" />
                </label>
              </div>
              <div class="dspy-field">
                <label>
                  <span>Enable replay audit</span>
                  <label class="toggle"><input type="checkbox" x-model="config.enable_replay_audit" /><span class="slider"></span></label>
                </label>
              </div>
            </div>

            <div class="dspy-card">
              <h2>RLM long-context analysis</h2>
              <div class="dspy-field">
                <label>
                  <span>RLM analysis enabled</span>
                  <label class="toggle"><input type="checkbox" x-model="config.rlm.enabled" /><span class="slider"></span></label>
                </label>
                <small>Explores redacted aggregate evidence with DSPy's bounded, sandboxed RLM. Leave the selector blank to inherit Agent Zero's effective utility model.</small>
              </div>
              <div class="dspy-field">
                <label><span>DSPy model selector</span><input type="text" x-model="config.rlm.model_ref" placeholder="Auto: Agent Zero utility model" /></label>
              </div>
              <div class="dspy-field inline">
                <label><span>REPL iterations</span><input type="number" min="1" max="20" x-model.number="config.rlm.max_iters" /></label>
              </div>
              <div class="dspy-field inline">
                <label><span>Recursive LM calls</span><input type="number" min="1" max="50" x-model.number="config.rlm.max_llm_calls" /></label>
              </div>
              <div class="dspy-field inline">
                <label><span>Output character cap</span><input type="number" min="1000" max="50000" step="1000" x-model.number="config.rlm.max_output_chars" /></label>
              </div>
              <div class="dspy-field inline">
                <label><span>Finding cap</span><input type="number" min="1" max="32" x-model.number="config.rlm.max_findings" /></label>
              </div>
            </div>
          </section>

          <section class="dspy-card prompt-lab" data-section-id="prompt-optimization-lab">
            <h2>Advanced Prompt Optimization Lab</h2>
            <p class="prompt-lab__warning">Experimental and opt-in. Candidates are stored as versioned overlays; Agent Zero prompt files are never rewritten. Automatic activation always passes through a bounded canary.</p>
            <div class="dspy-grid dspy-grid--small">
              <div class="dspy-field">
                <label><span>Enable prompt optimization</span><label class="toggle"><input type="checkbox" x-model="config.prompt_optimization.enabled" /><span class="slider"></span></label></label>
                <small>Guidance overlays remain the safe default until another target mode is selected.</small>
              </div>
              <div class="dspy-field">
                <label><span>Approve local prompt snapshots</span><label class="toggle"><input type="checkbox" x-model="config.prompt_optimization.allow_prompt_capture" /><span class="slider"></span></label></label>
                <small>Required for direct component modes. Snapshots remain in the plugin's local SQLite store.</small>
              </div>
              <div class="dspy-cell">
                <label>Optimization target</label>
                <select x-model="config.prompt_optimization.target_mode">
                  <option value="guidance_overlay">Guidance overlay</option>
                  <option value="selected_components">Selected components</option>
                  <option value="assembled_prompt">Assembled mutable prompt</option>
                </select>
              </div>
              <div class="dspy-cell">
                <label>Activation policy</label>
                <select x-model="config.prompt_optimization.activation_mode">
                  <option value="manual">Manual</option>
                  <option value="canary">Canary</option>
                  <option value="automatic">Automatic after canary</option>
                </select>
              </div>
            </div>
            <div class="prompt-lab__columns" x-show="config.prompt_optimization.target_mode !== 'guidance_overlay'">
              <div class="prompt-lab__group">
                <h3>Targeting and budget</h3>
                <label x-show="config.prompt_optimization.target_mode === 'selected_components'">Component IDs
                  <textarea rows="4" :value="(config.prompt_optimization.selected_components || []).join('\n')" @input="config.prompt_optimization.selected_components = String($event.target.value || '').split('\n').map(v => v.trim()).filter(Boolean)"></textarea>
                </label>
                <small>Component IDs appear in the live cockpit after a prompt snapshot is captured. Protected components are always rejected server-side.</small>
                <label>Snapshot character cap<input type="number" min="1000" max="250000" step="1000" x-model.number="config.prompt_optimization.max_snapshot_chars" /></label>
                <label>Components per compile<input type="number" min="1" max="12" x-model.number="config.prompt_optimization.max_components_per_compile" /></label>
              </div>
              <div class="prompt-lab__group">
                <h3>Canary and rollback</h3>
                <label>Canary traffic (%)<input type="number" min="1" max="100" x-model.number="config.prompt_optimization.canary_percentage" /></label>
                <label>Minimum observations<input type="number" min="3" max="1000" x-model.number="config.prompt_optimization.canary_min_observations" /></label>
                <label>Maximum observations<input type="number" min="3" max="5000" x-model.number="config.prompt_optimization.canary_max_observations" /></label>
                <label class="dspy-field-toggle"><span>Automatic rollback</span><label class="toggle"><input type="checkbox" x-model="config.prompt_optimization.rollback.enabled" /><span class="slider"></span></label></label>
                <label>Maximum score regression<input type="number" min="0" max="1" step="0.01" x-model.number="config.prompt_optimization.rollback.maximum_score_regression" /></label>
                <label>Failure-rate increase<input type="number" min="0" max="1" step="0.01" x-model.number="config.prompt_optimization.rollback.maximum_failure_rate_increase" /></label>

                <input type="number" min="1" max="300" step="1" x-model.number="config.scheduler_poll_interval_seconds" />
              </div>

                <input type="number" min="10" max="2000" step="1" x-model.number="config.scheduler_job_lease_seconds" />
              </div>

              </div>

                <label>Heartbeat (sec)</label>
                <input type="number" min="2" max="120" step="1" x-model.number="config.scheduler_heartbeat_seconds" />
              </div>
              <div class="dspy-cell">
                <label>Stale worker timeout</label>
                <input type="number" min="20" max="3600" step="1" x-model.number="config.scheduler_stale_worker_seconds" />
              </div>
              <div class="dspy-cell">
                <label>Lock TTL</label>
                <input type="number" min="10" max="600" step="1" x-model.number="config.scheduler_lock_ttl_seconds" />
              </div>
              <div class="dspy-cell">
                <label>Backoff base (sec)</label>
                <input type="number" min="1" max="120" step="1" x-model.number="config.scheduler_backoff_base_seconds" />
              </div>
              <div class="dspy-cell">
                <label>Single-tenant enforcement</label>
                <label class="toggle inline"><input type="checkbox" x-model="config.scheduler_enforce_single_tenant_per_context" /><span class="slider"></span></label>

            </div>
          </section>

          <section class="dspy-card">
            <h2>Quality gates</h2>
            <div class="dspy-matrix-grid">
              <article class="dspy-matrix-card">

                <label class="dspy-field-toggle"><span>Enabled</span><label class="toggle"><input type="checkbox" x-model="config.matrix.shell.enabled" /><span class="slider"></span></label></label>
                <label>Safety weight
                  <input type="number" min="0" max="1" step="0.01" x-model.number="config.matrix.shell.command_safety_weight" />
                </label>
                <label>Safety threshold
                  <input type="number" min="0" max="1" step="0.01" x-model.number="config.matrix.shell.command_safety_threshold" />
                </label>
                <label>Safety hard fail
                  <input type="number" min="0" max="1" step="0.01" x-model.number="config.matrix.shell.command_safety_hard_fail" />
                </label>
                <label>Reliability weight
                  <input type="number" min="0" max="1" step="0.01" x-model.number="config.matrix.shell.execution_reliability_weight" />
                </label>
                <label>Reliability threshold
                  <input type="number" min="0" max="1" step="0.01" x-model.number="config.matrix.shell.execution_reliability_threshold" />
                </label>
                <label>Reliability hard fail
                  <input type="number" min="0" max="1" step="0.01" x-model.number="config.matrix.shell.execution_reliability_hard_fail" />
                </label>
                <label>Semantic match weight
                  <input type="number" min="0" max="1" step="0.01" x-model.number="config.matrix.shell.semantic_match_weight" />
                </label>
                <label>Semantic threshold
                  <input type="number" min="0" max="1" step="0.01" x-model.number="config.matrix.shell.semantic_match_threshold" />
                </label>
              </article>

              <article class="dspy-matrix-card">
                <header>Tool retrieval</header>
                <label class="dspy-field-toggle"><span>Enabled</span><label class="toggle"><input type="checkbox" x-model="config.matrix.tool_retrieval.enabled" /><span class="slider"></span></label></label>
                <label>Recall weight
                  <input type="number" min="0" max="1" step="0.01" x-model.number="config.matrix.tool_retrieval.evidence_recall_weight" />
                </label>
                <label>Recall threshold
                  <input type="number" min="0" max="1" step="0.01" x-model.number="config.matrix.tool_retrieval.evidence_recall_threshold" />
                </label>
                <label>Recall hard fail
                  <input type="number" min="0" max="1" step="0.01" x-model.number="config.matrix.tool_retrieval.evidence_recall_hard_fail" />
                </label>
                <label>Precision weight
                  <input type="number" min="0" max="1" step="0.01" x-model.number="config.matrix.tool_retrieval.evidence_precision_weight" />
                </label>
                <label>Precision threshold
                  <input type="number" min="0" max="1" step="0.01" x-model.number="config.matrix.tool_retrieval.evidence_precision_threshold" />
                </label>
                <label>Precision hard fail
                  <input type="number" min="0" max="1" step="0.01" x-model.number="config.matrix.tool_retrieval.evidence_precision_hard_fail" />
                </label>
                <label>Semantic weight
                  <input type="number" min="0" max="1" step="0.01" x-model.number="config.matrix.tool_retrieval.semantic_match_weight" />
                </label>
                <label>Semantic threshold
                  <input type="number" min="0" max="1" step="0.01" x-model.number="config.matrix.tool_retrieval.semantic_match_threshold" />
                </label>
              </article>

              <article class="dspy-matrix-card">
                <header>Reasoning</header>
                <label class="dspy-field-toggle"><span>Enabled</span><label class="toggle"><input type="checkbox" x-model="config.matrix.reasoning.enabled" /><span class="slider"></span></label></label>
                <label>Answer quality weight
                  <input type="number" min="0" max="1" step="0.01" x-model.number="config.matrix.reasoning.answer_quality_weight" />
                </label>
                <label>Answer quality threshold
                  <input type="number" min="0" max="1" step="0.01" x-model.number="config.matrix.reasoning.answer_quality_threshold" />
                </label>
                <label>Answer quality hard fail
                  <input type="number" min="0" max="1" step="0.01" x-model.number="config.matrix.reasoning.answer_quality_hard_fail" />
                </label>
                <label>Policy weight
                  <input type="number" min="0" max="1" step="0.01" x-model.number="config.matrix.reasoning.policy_compliance_weight" />
                </label>
                <label>Policy threshold
                  <input type="number" min="0" max="1" step="0.01" x-model.number="config.matrix.reasoning.policy_compliance_threshold" />
                </label>
                <label>Policy hard fail
                  <input type="number" min="0" max="1" step="0.01" x-model.number="config.matrix.reasoning.policy_compliance_hard_fail" />
                </label>
                <label>Semantic weight
                  <input type="number" min="0" max="1" step="0.01" x-model.number="config.matrix.reasoning.semantic_match_weight" />
                </label>
                <label>Semantic threshold
                  <input type="number" min="0" max="1" step="0.01" x-model.number="config.matrix.reasoning.semantic_match_threshold" />
                </label>
              </article>

              <article class="dspy-matrix-card">
                <header>Decision making</header>
                <label class="dspy-field-toggle"><span>Enabled</span><label class="toggle"><input type="checkbox" x-model="config.matrix.decision_making.enabled" /><span class="slider"></span></label></label>
                <label>Policy weight
                  <input type="number" min="0" max="1" step="0.01" x-model.number="config.matrix.decision_making.policy_compliance_weight" />
                </label>
                <label>Policy threshold
                  <input type="number" min="0" max="1" step="0.01" x-model.number="config.matrix.decision_making.policy_compliance_threshold" />
                </label>
                <label>Policy hard fail
                  <input type="number" min="0" max="1" step="0.01" x-model.number="config.matrix.decision_making.policy_compliance_hard_fail" />
                </label>
                <label>Semantic weight
                  <input type="number" min="0" max="1" step="0.01" x-model.number="config.matrix.decision_making.semantic_match_weight" />
                </label>
                <label>Semantic threshold
                  <input type="number" min="0" max="1" step="0.01" x-model.number="config.matrix.decision_making.semantic_match_threshold" />
                </label>
                <label>Semantic hard fail
                  <input type="number" min="0" max="1" step="0.01" x-model.number="config.matrix.decision_making.semantic_match_hard_fail" />
                </label>
                <label>Answer quality weight
                  <input type="number" min="0" max="1" step="0.01" x-model.number="config.matrix.decision_making.answer_quality_weight" />
                </label>
                <label>Answer quality threshold
                  <input type="number" min="0" max="1" step="0.01" x-model.number="config.matrix.decision_making.answer_quality_threshold" />
                </label>
                <label>Answer quality hard fail
                  <input type="number" min="0" max="1" step="0.01" x-model.number="config.matrix.decision_making.answer_quality_hard_fail" />
                </label>
              </article>
            </div>
          </section>

          <section class="dspy-grid">
            <div class="dspy-card">
              <h2>Semantic evaluator</h2>
              <div class="dspy-field">
                <label>
                  <span>Enable semantic evaluator</span>
                  <label class="toggle"><input type="checkbox" x-model="config.evaluator.enable_semantic_judge" /><span class="slider"></span></label>
                </label>
              </div>
              <div class="dspy-field">
                <label>
                  <span>Preferred DSPy model</span>
                  <input type="text" x-model="config.evaluator.preferred_dspy_model" placeholder="optional" />
                </label>
              </div>
              <div class="dspy-field inline">
                <label>
                  <span>Batch size</span>
                  <input type="number" min="1" max="64" step="1" x-model.number="config.evaluator.semantic_loop_batch_size" />
                </label>
              </div>
              <div class="dspy-field inline">
                <label>
                  <span>Risk threshold</span>
                  <input type="number" min="0" max="1" step="0.01" x-model.number="config.evaluator.risk_threshold" />
                </label>
              </div>
              <div class="dspy-field">
                <label>
                  <span>Policy breach keywords</span>
                  <textarea
                    rows="8"
                    :value="(config.evaluator.policy_breach_keywords || []).join('\n')"
                    @input="
                      const values = String($event.target.value || '').split('\n').map((value) => value.trim()).filter(Boolean);
                      config.evaluator.policy_breach_keywords = values;
                    "
                  ></textarea>
                </label>
                <small>One keyword per line.</small>
              </div>
            </div>

            <div class="dspy-card">
              <h2>Guidance delivery</h2>
              <div class="dspy-field">
                <label>
                  <span>Inject guidance</span>
                  <label class="toggle"><input type="checkbox" x-model="config.prompt.inject_guidance" /><span class="slider"></span></label>
                </label>
              </div>
              <div class="dspy-field">
                <label>
                  <span>Inject without guidance</span>
                  <label class="toggle"><input type="checkbox" x-model="config.prompt.inject_even_without_guidance" /><span class="slider"></span></label>
                </label>
              </div>
              <div class="dspy-field inline">
                <label>
                  <span>Max injected chars</span>
                  <input type="number" min="128" max="30000" step="64" x-model.number="config.prompt.max_injected_chars" />
                </label>
              </div>
              <div class="dspy-field">
                <label>
                  <span>Fallback guidance</span>
                  <textarea rows="6" x-model="config.prompt.fallback_guidance"></textarea>
                </label>
              </div>
            </div>

            <div class="dspy-card">
              <h2>Worker environment</h2>
              <div class="dspy-field inline">
                <label>
                  <span>Install mode</span>
                  <select x-model="config.dependencies.install_mode">
                    <option value="isolated_worker">isolated worker</option>
                  </select>
                </label>
              </div>
              <div class="dspy-field">
                <label>
                  <span>Dependency manifest</span>
                  <input type="text" x-model="config.dependencies.dependency_file" />
                </label>
              </div>
              <div class="dspy-field">
                <label>
                  <span>Fallback to pip</span>
                  <label class="toggle"><input type="checkbox" x-model="config.dependencies.fallback_to_pip" /><span class="slider"></span></label>
                </label>
              </div>
              <div class="dspy-field">
                <label>
                  <span>Ensure at startup</span>
                  <label class="toggle"><input type="checkbox" x-model="config.dependencies.ensure_at_startup" /><span class="slider"></span></label>
                </label>
              </div>
              <div class="dspy-field inline">
                <label>
                  <span>Install timeout</span>
                  <input type="number" min="0" max="1800" step="15" x-model.number="config.dependencies.install_timeout_seconds" />
                </label>
              </div>
              <p class="hint">Install, update, and Docker startup hooks maintain the isolated worker environment automatically. Agent Zero's interpreter is not modified.</p>
            </div>
          </section>
        </section>
      </template>
      <template x-if="!config || typeof config !== 'object'">
        <p class="dspy-config-empty-state">Loading saved settings…</p>
      </template>
    </div>
  </body>

  <style>
    :root {
      --dspy-bg-1: #0a1631;
      --dspy-bg-2: #111c3b;
      --dspy-surface: color-mix(in srgb, #111a38 78%, transparent);
      --dspy-stroke: color-mix(in srgb, #9db7ff 24%, transparent);
      --dspy-text: #edf2ff;
      --dspy-soft: #a2aecb;
      --dspy-soft-border: color-mix(in srgb, #9fc4ff 28%, transparent);
      --dspy-on: #3ed1a4;
      --dspy-off: #d66a68;
      --dspy-shadow: 0 18px 45px rgba(0, 0, 0, 0.35);
    }

    @keyframes reveal {
      from {
        opacity: 0;
        transform: translateY(8px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .dspy-config-shell {
      color: var(--dspy-text);
      background: radial-gradient(circle at 14% 14%, rgba(120, 160, 255, 0.18), transparent 38%),
        radial-gradient(circle at 84% 0%, rgba(76, 190, 162, 0.17), transparent 32%),
        linear-gradient(165deg, var(--dspy-bg-1), var(--dspy-bg-2));
      border: 1px solid var(--dspy-stroke);
      border-radius: 16px;
      padding: 18px;
      margin-bottom: 2px;
      box-shadow: var(--dspy-shadow);
      animation: reveal 320ms ease;
      backdrop-filter: blur(2px);
      font-family: 'Trebuchet MS', 'Avenir Next', 'Segoe UI', sans-serif;
    }

    .dspy-config-header {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: flex-start;
      margin-bottom: 14px;
      flex-wrap: wrap;
    }

    .dspy-eyebrow {
      text-transform: uppercase;
      letter-spacing: 0.16em;
      font-size: 0.72rem;
      margin: 0 0 4px;
      color: #86bfff;
      font-weight: 700;
    }

    h1 {
      margin: 0;
      font-size: clamp(1.35rem, 2.4vw, 1.9rem);
      line-height: 1.1;
    }

    .dspy-subtitle {
      margin: 8px 0 0;
      color: var(--dspy-soft);
      font-size: 0.9rem;
      max-width: 64ch;
    }

    .dspy-header-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
      justify-content: flex-end;
    }

    .dspy-status-pill {
      border-radius: 999px;
      padding: 6px 12px;
      font-size: 0.8rem;
      border: 1px solid var(--dspy-soft-border);
      background: rgba(255, 255, 255, 0.05);
      color: #deebff;
      text-transform: capitalize;
    }

    .dspy-status-pill.is-on {
      border-color: rgba(62, 209, 164, 0.55);
      color: #9ef0cc;
      background: rgba(62, 209, 164, 0.12);
    }

    .dspy-status-pill.is-off {
      border-color: rgba(214, 106, 104, 0.55);
      color: #ffc7c6;
      background: rgba(214, 106, 104, 0.14);
    }

    .dspy-presets {
      display: flex;
      gap: 8px;
      margin-bottom: 12px;
      flex-wrap: wrap;
    }

    .dspy-btn {
      border: 1px solid var(--dspy-soft-border);
      background: rgba(255, 255, 255, 0.06);
      color: #e6ecff;
      border-radius: 8px;
      padding: 7px 14px;
      font-weight: 700;
      letter-spacing: 0.01em;
    }

    .dspy-btn.is-strong {
      border-color: rgba(62, 209, 164, 0.55);
      background: rgba(62, 209, 164, 0.12);
    }

    .dspy-btn:hover {
      background: rgba(255, 255, 255, 0.13);
    }

    .dspy-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 10px;
      margin-bottom: 10px;
    }

    .dspy-grid--small {
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
    }

    .dspy-card {
      background: color-mix(in srgb, var(--dspy-surface) 84%, transparent);
      border: 1px solid var(--dspy-soft-border);
      border-radius: 12px;
      padding: 12px;
      display: grid;
      gap: 9px;
    }

    .dspy-card > h2 {
      margin: 0;
      font-size: 1rem;
      letter-spacing: 0.015em;
    }

    .dspy-field,
    .dspy-cell {
      display: grid;
      gap: 6px;
    }

    .dspy-cell label,
    .dspy-field label {
      font-size: 0.83rem;
      display: grid;
      gap: 6px;
      color: #deecff;
    }

    .dspy-card small,
    .dspy-cell small,
    .hint {
      color: var(--dspy-soft);
      font-size: 0.74rem;
      line-height: 1.25;
      margin: 0;
    }

    .dspy-field-toggle {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .dspy-field input[type='number'],
    .dspy-cell input,
    .dspy-field input[type='text'],
    .dspy-field select,
    .dspy-cell select,
    textarea {
      width: 100%;
      border-radius: 8px;
      border: 1px solid var(--dspy-soft-border);
      background: rgba(10, 17, 41, 0.8);
      color: var(--dspy-text);
      padding: 7px 8px;
      font: inherit;
    }

    .dspy-matrix-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 10px;
    }

    .dspy-matrix-card {
      border: 1px solid var(--dspy-soft-border);
      border-radius: 10px;
      background: rgba(16, 27, 52, 0.45);
      padding: 10px;
      display: grid;
      gap: 8px;
    }

    .dspy-matrix-card header {
      font-weight: 700;
      letter-spacing: 0.02em;
      margin-bottom: 2px;
      font-size: 0.86rem;
      color: #d6e7ff;
    }

    .toggle {
      position: relative;
      width: 38px;
      height: 20px;
      display: inline-flex;
      align-items: center;
    }

    .toggle input {
      opacity: 0;
      position: absolute;
      width: 100%;
      height: 100%;
      margin: 0;
      cursor: pointer;
    }

    .toggle .slider {
      width: 100%;
      height: 20px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.2);
      position: relative;
      transition: background 160ms ease;
    }

    .toggle .slider::after {
      content: '';
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: #f4f7ff;
      position: absolute;
      top: 3px;
      left: 3px;
      transition: transform 150ms ease;
      box-shadow: 0 0 0 0 rgba(62, 209, 164, 0.35);
    }

    .toggle input:checked + .slider {
      background: rgba(62, 209, 164, 0.5);
    }

    .toggle input:checked + .slider::after {
      transform: translateX(18px);
      background: #effcff;
    }

    .dspy-cell .toggle {
      margin-left: auto;
    }

    .dspy-config-empty-state {
      margin: 0;
      color: var(--dspy-soft);
      font-size: 0.9rem;
      padding: 0.5rem 0;
    }

    @media (max-width: 1020px) {
      .dspy-config-header,
      .dspy-grid {
        gap: 10px;
      }

      .dspy-card {
        padding: 10px;
      }
    }

    @media (max-width: 768px) {
      .dspy-btn,
      .dspy-field input,
      .dspy-field select,
      .dspy-cell input,
      .dspy-cell select,
      textarea {
        width: 100%;
      }

      .dspy-presets {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
      }
    }
  </style>
  <link rel="stylesheet" href="/plugins/dspy_rlm/webui/dspy-rlm-polish.css?v=101" />
  <script type="module" src="/plugins/dspy_rlm/webui/dspy-rlm-config-ui.js?v=100"></script>
</html>
