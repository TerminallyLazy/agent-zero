<html>
<head>
    <title>Design Studio</title>
</head>
<body>
<div x-data>
    <template x-if="$store.pluginSettings.settings">
        <div>
            <div class="section-title">Design Studio</div>
            <div class="section-description">
                AI-powered image generation and visual editing studio with multi-provider support via LiteLLM and FAL.ai.
            </div>

            <!-- <div class="field">
                <div class="field-label">
                    <div class="field-title">Generation Model</div>
                    <div class="field-description">
                        LiteLLM model for image generation (e.g., gemini/gemini-2.0-flash-exp-image-generation, dall-e-3).
                    </div>
                </div>
                <div class="field-control">
                    <input type="text"
                           x-model="$store.pluginSettings.settings.image_generation_model"
                           placeholder="gemini/gemini-3.1-flash-image-preview">
                </div>
            </div> -->

            <div class="field">
                <div class="field-label">
                    <div class="field-title">Default Image Size</div>
                    <div class="field-description">
                        Default dimensions for generated images.
                    </div>
                </div>
                <div class="field-control">
                    <select x-model="$store.pluginSettings.settings.default_size">
                        <option value="1024x1024">1024x1024</option>
                        <option value="1024x1792">1024x1792 (Portrait)</option>
                        <option value="1792x1024">1792x1024 (Landscape)</option>
                        <option value="512x512">512x512</option>
                    </select>
                </div>
            </div>

            <div class="field">
                <div class="field-label">
                    <div class="field-title">Default Generation Count</div>
                    <div class="field-description">
                        Number of images to generate per request (1-4).
                    </div>
                </div>
                <div class="field-control">
                    <input type="number" min="1" max="4"
                           x-model.number="$store.pluginSettings.settings.default_count">
                </div>
            </div>

            <div class="field">
                <div class="field-label">
                    <div class="field-title">FAL API Key</div>
                    <div class="field-description">
                        API key for FAL.ai image generation (FLUX models). Get one at
                        <a href="https://fal.ai/dashboard/keys" target="_blank">fal.ai/dashboard/keys</a>.
                    </div>
                </div>
                <div class="field-control">
                    <input type="password"
                           x-model="$store.pluginSettings.settings.fal_api_key"
                           autocomplete="off"
                           placeholder="Enter your FAL API key">
                </div>
            </div>

            <div class="field">
                <div class="field-label">
                    <div class="field-title">Gallery Storage Path</div>
                    <div class="field-description">
                        Subdirectory for saved images, relative to the agent workspace directory.
                    </div>
                </div>
                <div class="field-control">
                    <input type="text"
                           x-model="$store.pluginSettings.settings.gallery_path"
                           placeholder="images">
                </div>
            </div>

            <div class="field">
                <div class="field-label">
                    <div class="field-title">Open Studio</div>
                    <div class="field-description">
                        Launch the Design Studio in a new modal window.
                    </div>
                </div>
                <div class="field-control">
                    <button class="btn btn-field"
                            @click="openModal('/plugins/a0_design_studio/webui/main.html')">
                        Open Design Studio
                    </button>
                </div>
            </div>
        </div>
    </template>
</div>
</body>
</html>
