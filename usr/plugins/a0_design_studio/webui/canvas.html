<html>
<body>
<div x-data="{
    ctx: null,
    bgCtx: null,
    maskCtx: null,
    isDrawing: false,
    isPanning: false,
    panStartX: 0,
    panStartY: 0,
    panScrollStartX: 0,
    panScrollStartY: 0,
    lastX: 0,
    lastY: 0,
    shapeStartX: 0,
    shapeStartY: 0,

    init() {
        this.$nextTick(() => {
            const canvas = this.$refs.drawCanvas;
            const bgCanvas = this.$refs.bgCanvas;
            const maskCanvas = this.$refs.maskCanvas;

            if (!canvas || !bgCanvas || !maskCanvas) return;

            this.ctx = canvas.getContext('2d');
            this.bgCtx = bgCanvas.getContext('2d');
            this.maskCtx = maskCanvas.getContext('2d');

            this.resizeCanvases();

            this.$watch('$store.designStudioStore.editing.sourceImage', (b64) => {
                if (b64) this.drawBackgroundImage(b64);
            });

            // Watch undo/redo restore signals
            this.$watch('$store.designStudioStore.canvas._restoreGen', () => {
                this.restoreDrawCanvas();
            });

            // Watch mask clear signal
            this.$watch('$store.designStudioStore.canvas._clearMaskGen', () => {
                if (this.maskCtx && this.$refs.maskCanvas) {
                    this.maskCtx.clearRect(0, 0, this.$refs.maskCanvas.width, this.$refs.maskCanvas.height);
                }
            });

            // Watch download signal — composite all layers and trigger file download
            this.$watch('$store.designStudioStore.canvas._downloadGen', () => {
                this.compositeAndDownload();
            });
        });
    },

    resizeCanvases() {
        const container = this.$refs.canvasContainer;
        if (!container) return;
        const w = container.clientWidth;
        const h = container.clientHeight;

        [this.$refs.bgCanvas, this.$refs.drawCanvas, this.$refs.maskCanvas].forEach(c => {
            if (c) { c.width = w; c.height = h; }
        });
    },

    drawBackgroundImage(b64) {
        const img = new Image();
        img.onload = () => {
            this.bgCtx.clearRect(0, 0, this.$refs.bgCanvas.width, this.$refs.bgCanvas.height);
            const scale = Math.min(
                this.$refs.bgCanvas.width / img.width,
                this.$refs.bgCanvas.height / img.height
            );
            const x = (this.$refs.bgCanvas.width - img.width * scale) / 2;
            const y = (this.$refs.bgCanvas.height - img.height * scale) / 2;
            this.bgCtx.drawImage(img, x, y, img.width * scale, img.height * scale);
        };
        img.src = 'data:image/png;base64,' + b64;
    },

    restoreDrawCanvas() {
        const dataUrl = this.$store.designStudioStore.canvas._restore;
        const canvas = this.$refs.drawCanvas;
        if (!canvas || !this.ctx) return;

        this.ctx.clearRect(0, 0, canvas.width, canvas.height);

        if (dataUrl) {
            const img = new Image();
            img.onload = () => {
                this.ctx.drawImage(img, 0, 0);
            };
            img.src = dataUrl;
        }
    },

    getPos(e) {
        const rect = this.$refs.drawCanvas.getBoundingClientRect();
        const clientX = e.touches ? e.touches[0].clientX : e.clientX;
        const clientY = e.touches ? e.touches[0].clientY : e.clientY;
        const zoom = this.$store.designStudioStore.canvas.zoom || 1;
        return {
            x: (clientX - rect.left) / zoom,
            y: (clientY - rect.top) / zoom,
        };
    },

    getRawClientPos(e) {
        return {
            x: e.touches ? e.touches[0].clientX : e.clientX,
            y: e.touches ? e.touches[0].clientY : e.clientY,
        };
    },

    onPointerDown(e) {
        e.preventDefault();
        const store = this.$store.designStudioStore;
        const tool = store.canvas.tool;

        // Pan: track viewport scroll drag
        if (tool === 'pan') {
            this.isPanning = true;
            const raw = this.getRawClientPos(e);
            this.panStartX = raw.x;
            this.panStartY = raw.y;
            const viewport = this.$refs.canvasContainer.closest('.ds-canvas-viewport');
            if (viewport) {
                this.panScrollStartX = viewport.scrollLeft;
                this.panScrollStartY = viewport.scrollTop;
            }
            return;
        }

        // Text: handled entirely on pointerUp (click-to-place)
        if (tool === 'text') return;

        this.isDrawing = true;
        const pos = this.getPos(e);
        this.lastX = pos.x;
        this.lastY = pos.y;
        this.shapeStartX = pos.x;
        this.shapeStartY = pos.y;

        const targetCtx = tool === 'mask' ? this.maskCtx : this.ctx;
        targetCtx.beginPath();
        targetCtx.moveTo(pos.x, pos.y);
    },

    onPointerMove(e) {
        const store = this.$store.designStudioStore;
        const tool = store.canvas.tool;

        // Pan: scroll the viewport
        if (this.isPanning && tool === 'pan') {
            e.preventDefault();
            const raw = this.getRawClientPos(e);
            const dx = raw.x - this.panStartX;
            const dy = raw.y - this.panStartY;
            const viewport = this.$refs.canvasContainer.closest('.ds-canvas-viewport');
            if (viewport) {
                viewport.scrollLeft = this.panScrollStartX - dx;
                viewport.scrollTop = this.panScrollStartY - dy;
            }
            return;
        }

        if (!this.isDrawing) return;
        e.preventDefault();
        const pos = this.getPos(e);
        const targetCtx = tool === 'mask' ? this.maskCtx : this.ctx;

        if (tool === 'brush' || tool === 'mask') {
            targetCtx.lineWidth = store.canvas.brushSize;
            targetCtx.lineCap = 'round';
            targetCtx.lineJoin = 'round';
            targetCtx.strokeStyle = tool === 'mask' ? 'rgba(255, 0, 0, 0.5)' : store.canvas.color;
            targetCtx.lineTo(pos.x, pos.y);
            targetCtx.stroke();
        } else if (tool === 'eraser') {
            targetCtx.globalCompositeOperation = 'destination-out';
            targetCtx.lineWidth = store.canvas.brushSize;
            targetCtx.lineCap = 'round';
            targetCtx.lineTo(pos.x, pos.y);
            targetCtx.stroke();
            targetCtx.globalCompositeOperation = 'source-over';
        }

        this.lastX = pos.x;
        this.lastY = pos.y;
    },

    onPointerUp(e) {
        const store = this.$store.designStudioStore;
        const tool = store.canvas.tool;

        // Pan: stop panning
        if (this.isPanning) {
            this.isPanning = false;
            return;
        }

        // Text: place text at click position
        if (tool === 'text') {
            const pos = this.getPos(e);
            const text = prompt('Enter text:');
            if (text) {
                const fontSize = Math.max(store.canvas.brushSize * 3, 14);
                this.ctx.font = `${fontSize}px sans-serif`;
                this.ctx.fillStyle = store.canvas.color;
                this.ctx.textBaseline = 'top';
                this.ctx.fillText(text, pos.x, pos.y);
                store.saveCanvasState(this.$refs.drawCanvas.toDataURL());
            }
            return;
        }

        if (!this.isDrawing) return;
        this.isDrawing = false;
        const targetCtx = tool === 'mask' ? this.maskCtx : this.ctx;
        const pos = this.getPos(e);

        if (tool === 'rect') {
            targetCtx.strokeStyle = store.canvas.color;
            targetCtx.lineWidth = store.canvas.brushSize;
            targetCtx.strokeRect(
                this.shapeStartX, this.shapeStartY,
                pos.x - this.shapeStartX, pos.y - this.shapeStartY
            );
        } else if (tool === 'circle') {
            const rx = Math.abs(pos.x - this.shapeStartX) / 2;
            const ry = Math.abs(pos.y - this.shapeStartY) / 2;
            const cx = this.shapeStartX + (pos.x - this.shapeStartX) / 2;
            const cy = this.shapeStartY + (pos.y - this.shapeStartY) / 2;
            targetCtx.strokeStyle = store.canvas.color;
            targetCtx.lineWidth = store.canvas.brushSize;
            targetCtx.beginPath();
            targetCtx.ellipse(cx, cy, rx, ry, 0, 0, Math.PI * 2);
            targetCtx.stroke();
        } else if (tool === 'arrow') {
            this.drawArrow(targetCtx, this.shapeStartX, this.shapeStartY, pos.x, pos.y, store.canvas.color, store.canvas.brushSize);
        }

        // Save draw canvas state for undo/redo
        if (tool !== 'mask') {
            store.saveCanvasState(this.$refs.drawCanvas.toDataURL());
        }

        // Export mask canvas to store when mask tool is used
        if (tool === 'mask') {
            const maskDataUrl = this.$refs.maskCanvas.toDataURL('image/png');
            // Strip data URL prefix to get raw base64
            store.editing.mask = maskDataUrl.replace(/^data:image\/png;base64,/, '');
        }
    },

    compositeAndDownload() {
        const bg = this.$refs.bgCanvas;
        const draw = this.$refs.drawCanvas;
        if (!bg || !draw) return;

        // Create offscreen canvas at same resolution
        const out = document.createElement('canvas');
        out.width = bg.width;
        out.height = bg.height;
        const outCtx = out.getContext('2d');

        // Composite: background first, then drawings on top
        outCtx.drawImage(bg, 0, 0);
        outCtx.drawImage(draw, 0, 0);

        // Trigger download
        const a = document.createElement('a');
        a.download = 'design-studio-' + Date.now() + '.png';
        a.href = out.toDataURL('image/png');
        a.click();
    },

    drawArrow(ctx, fromX, fromY, toX, toY, color, width) {
        const headLen = 15;
        const angle = Math.atan2(toY - fromY, toX - fromX);
        ctx.strokeStyle = color;
        ctx.lineWidth = width;
        ctx.beginPath();
        ctx.moveTo(fromX, fromY);
        ctx.lineTo(toX, toY);
        ctx.lineTo(toX - headLen * Math.cos(angle - Math.PI / 6), toY - headLen * Math.sin(angle - Math.PI / 6));
        ctx.moveTo(toX, toY);
        ctx.lineTo(toX - headLen * Math.cos(angle + Math.PI / 6), toY - headLen * Math.sin(angle + Math.PI / 6));
        ctx.stroke();
    }
}" class="ds-canvas-container" x-ref="canvasContainer"
   :style="`transform: scale(${$store.designStudioStore.canvas.zoom}); transform-origin: top left;`">
    <canvas x-ref="bgCanvas" class="ds-canvas ds-canvas-bg"></canvas>
    <canvas x-ref="drawCanvas" class="ds-canvas ds-canvas-draw"
            :class="{'ds-cursor-pan': $store.designStudioStore.canvas.tool === 'pan', 'ds-cursor-text': $store.designStudioStore.canvas.tool === 'text'}"
            @pointerdown="onPointerDown($event)"
            @pointermove="onPointerMove($event)"
            @pointerup="onPointerUp($event)"
            @pointerleave="onPointerUp($event)"></canvas>
    <canvas x-ref="maskCanvas" class="ds-canvas ds-canvas-mask"
            :class="{'ds-canvas-visible': $store.designStudioStore.canvas.tool === 'mask'}"></canvas>

    <div class="ds-canvas-empty"
         x-show="!$store.designStudioStore.editing.sourceImage">
        <span class="material-symbols-outlined">image</span>
        <p>Generate an image or load one from the gallery</p>
    </div>
</div>
</body>
</html>
