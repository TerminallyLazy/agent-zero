# Context Engine services for Agent Zero
# Usage: docker compose -f docker-compose.context-engine.yaml up -d
#
# Starts Qdrant, Redis, embedding, and Context Engine MCP services alongside
# Agent Zero.  Agent Zero's workdir is mounted into Context Engine as the
# codebase root for indexing and search.
#
# Port mapping (no conflicts with Agent Zero on 50001):
#   6333  - Qdrant REST API
#   6334  - Qdrant gRPC
#   6379  - Redis
#   8000  - MCP search (SSE)
#   8001  - MCP indexer (SSE)
#   8002  - MCP search (HTTP/JSON-RPC)
#   8003  - MCP indexer (HTTP/JSON-RPC)
#   8100  - Embedding service

services:
  # --- Storage layer ---

  ce-qdrant:
    image: qdrant/qdrant:latest
    container_name: ce-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - ce_qdrant_data:/qdrant/storage
    restart: unless-stopped
    networks:
      - ce-network

  ce-redis:
    image: redis:7-alpine
    container_name: ce-redis
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    volumes:
      - ce_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - ce-network

  # --- Processing layer ---

  ce-embedding:
    image: ghcr.io/context-engine-ai/embedding-service:latest
    # No container_name — allows deploy.replicas > 1
    ports:
      - "8100:8100"
    environment:
      EMBEDDING_MODEL: ${CE_EMBEDDING_MODEL:-nomic-ai/nomic-embed-text-v1.5}
      EMBED_MAX_CONCURRENT: "2"
      EMBED_MAX_BATCH: "256"
      ONNX_THREADS: "4"
      ONNX_DISABLE_SPINNING: "1"
      OMP_NUM_THREADS: "4"
      MKL_NUM_THREADS: "4"
      HF_HOME: /app/models
      FASTEMBED_CACHE_PATH: /app/models
    volumes:
      - ce_embedding_cache:/app/models
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8100/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      replicas: ${CE_EMBEDDING_REPLICAS:-2}
      resources:
        limits:
          memory: 6G
          cpus: "4"
    restart: unless-stopped
    networks:
      - ce-network

  # --- MCP layer ---

  ce-mcp:
    image: ghcr.io/context-engine-ai/mcp:latest
    container_name: ce-mcp
    depends_on:
      - ce-qdrant
    environment:
      FASTMCP_HOST: "0.0.0.0"
      FASTMCP_PORT: "8000"
      QDRANT_URL: http://ce-qdrant:6333
      COLLECTION_NAME: ${CE_COLLECTION:-codebase}
      PATH_EMIT_MODE: auto
      EMBEDDING_MODEL: ${CE_EMBEDDING_MODEL:-nomic-ai/nomic-embed-text-v1.5}
      EMBEDDING_PROVIDER: ${CE_EMBEDDING_PROVIDER:-remote}
      HF_HOME: /tmp/huggingface
      FASTEMBED_CACHE_PATH: /tmp/huggingface/fastembed
      HF_HUB_DISABLE_XET: "1"
    ports:
      - "8000:8000"
    volumes:
      - ${CE_WORKDIR:-./workdir}:/work:ro
    restart: unless-stopped
    networks:
      - ce-network

  ce-mcp-http:
    image: ghcr.io/context-engine-ai/mcp:latest
    container_name: ce-mcp-http
    depends_on:
      - ce-qdrant
    environment:
      FASTMCP_HOST: "0.0.0.0"
      FASTMCP_PORT: "8000"
      FASTMCP_TRANSPORT: streamable-http
      QDRANT_URL: http://ce-qdrant:6333
      COLLECTION_NAME: ${CE_COLLECTION:-codebase}
      PATH_EMIT_MODE: auto
      EMBEDDING_MODEL: ${CE_EMBEDDING_MODEL:-nomic-ai/nomic-embed-text-v1.5}
      EMBEDDING_PROVIDER: ${CE_EMBEDDING_PROVIDER:-remote}
      HF_HOME: /tmp/huggingface
      FASTEMBED_CACHE_PATH: /tmp/huggingface/fastembed
      HF_HUB_DISABLE_XET: "1"
    ports:
      - "8002:8000"
    volumes:
      - ${CE_WORKDIR:-./workdir}:/work:ro
    restart: unless-stopped
    networks:
      - ce-network

  ce-mcp-indexer:
    image: ghcr.io/context-engine-ai/mcp-indexer:latest
    container_name: ce-mcp-indexer
    depends_on:
      - ce-qdrant
      - ce-redis
    environment:
      FASTMCP_HOST: "0.0.0.0"
      FASTMCP_INDEXER_PORT: "8001"
      QDRANT_URL: http://ce-qdrant:6333
      COLLECTION_NAME: ${CE_COLLECTION:-codebase}
      PATH_EMIT_MODE: auto
      EMBEDDING_MODEL: ${CE_EMBEDDING_MODEL:-nomic-ai/nomic-embed-text-v1.5}
      EMBEDDING_PROVIDER: ${CE_EMBEDDING_PROVIDER:-remote}
      HF_HOME: /tmp/huggingface
      FASTEMBED_CACHE_PATH: /tmp/huggingface/fastembed
      CODEBASE_STATE_BACKEND: redis
      CODEBASE_STATE_REDIS_URL: redis://ce-redis:6379/0
    ports:
      - "8001:8001"
    volumes:
      - ${CE_WORKDIR:-./workdir}:/work:rw
      - ce_codebase_meta:/work/.codebase:rw
    restart: unless-stopped
    networks:
      - ce-network

  ce-mcp-indexer-http:
    image: ghcr.io/context-engine-ai/mcp-indexer:latest
    container_name: ce-mcp-indexer-http
    depends_on:
      - ce-qdrant
      - ce-redis
    environment:
      FASTMCP_HOST: "0.0.0.0"
      FASTMCP_INDEXER_PORT: "8001"
      FASTMCP_TRANSPORT: streamable-http
      QDRANT_URL: http://ce-qdrant:6333
      COLLECTION_NAME: ${CE_COLLECTION:-codebase}
      PATH_EMIT_MODE: auto
      EMBEDDING_MODEL: ${CE_EMBEDDING_MODEL:-nomic-ai/nomic-embed-text-v1.5}
      EMBEDDING_PROVIDER: ${CE_EMBEDDING_PROVIDER:-remote}
      HF_HOME: /tmp/huggingface
      FASTEMBED_CACHE_PATH: /tmp/huggingface/fastembed
      CODEBASE_STATE_BACKEND: redis
      CODEBASE_STATE_REDIS_URL: redis://ce-redis:6379/0
    ports:
      - "8003:8001"
    volumes:
      - ${CE_WORKDIR:-./workdir}:/work:rw
      - ce_codebase_meta:/work/.codebase:rw
    restart: unless-stopped
    networks:
      - ce-network

volumes:
  ce_qdrant_data:
  ce_redis_data:
  ce_embedding_cache:
  ce_codebase_meta:

networks:
  ce-network:
    driver: bridge
