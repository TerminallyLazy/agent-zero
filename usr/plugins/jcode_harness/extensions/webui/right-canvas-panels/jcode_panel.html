<template x-if="$store.rightCanvas && $store.rightCanvas.isSurfaceActive && $store.rightCanvas.isSurfaceActive('jcode')">
  <div x-data="jcodePanel()" x-init="init()" class="jcode-panel">
    <div class="jcode-tabstrip" role="tablist">
      <template x-for="page in pages" :key="page.id">
        <button type="button"
                role="tab"
                :class="{ active: page.id === focusedId }"
                :aria-selected="page.id === focusedId"
                @click="focusedId = page.id"
                x-text="page.title"></button>
      </template>
      <template x-if="pages.length === 0">
        <span class="jcode-panel-empty">
          No active jcode pages. Run a jcode_session to populate.
        </span>
      </template>
    </div>
    <div class="jcode-page-content"
         x-html="renderedContent()"></div>
    <div class="jcode-memory-strip" x-show="memoryEvents.length > 0">
      <strong>Memory:</strong>
      <template x-for="ev in memoryEvents.slice(-3)" :key="ev.ts">
        <span class="jcode-memory-chip" x-text="ev.summary"></span>
      </template>
    </div>
  </div>
</template>
