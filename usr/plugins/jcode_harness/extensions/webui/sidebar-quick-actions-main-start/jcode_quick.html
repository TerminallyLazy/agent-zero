<div x-data="jcodeQuick()" class="jcode-quick-actions" style="display: contents;">
  <button type="button"
          class="config-button"
          @click="newSession()"
          aria-label="New jcode session"
          title="Start a new jcode coding session">
    <span class="material-symbols-outlined">code</span>
  </button>
  <button type="button"
          class="config-button"
          @click="resumeSessionList()"
          aria-label="Resume jcode session"
          title="Pick a resumable session from any harness">
    <span class="material-symbols-outlined">history</span>
  </button>
</div>
