<head>
  <script type="module" src="/plugins/dj_booth/webui/dj-store.js"></script>
  <style>
    .djb-wrap { padding: 1rem; max-width: 1400px; margin: 0 auto; color: #e8e8f0; }
    .djb-header { display: flex; gap: 1rem; align-items: center; padding: 0.75rem 1rem;
                  background: #1a1a2e; border-radius: 8px; margin-bottom: 1rem; }
    .djb-badge { padding: 0.15rem 0.5rem; background: #16213e; border-radius: 4px;
                 font: 0.75rem 'JetBrains Mono', monospace; color: #00d4ff; }
    .djb-badge.fallback { color: #ffbe0b; }
    .djb-listeners { display: flex; align-items: center; gap: 0.4rem; font: 0.85rem monospace; }
    .djb-pulse { width: 8px; height: 8px; border-radius: 50%; background: #00ff88;
                 box-shadow: 0 0 8px #00ff88; animation: pulse 2s infinite; }
    @keyframes pulse { 50% { opacity: 0.3; } }
    .djb-stream-url { flex: 1; font: 0.8rem monospace; color: #aaa; }
    .djb-btn { padding: 0.4rem 0.9rem; border-radius: 4px; border: 1px solid #3a3a4e;
               background: #16213e; color: #e8e8f0; cursor: pointer; font-size: 0.85rem; }
    .djb-btn:hover { background: #233355; border-color: #00d4ff; }
    .djb-btn.start { background: #00ff88; color: #001a0c; border-color: #00ff88; }
    .djb-btn.stop  { background: #ff006e; color: #fff; border-color: #ff006e; }
    .djb-btn.sm { padding: 0.2rem 0.5rem; font-size: 0.75rem; }
    .djb-grid { display: grid; grid-template-columns: 5fr 3fr 5fr; gap: 1rem; }
    .djb-panel { background: #1a1a2e; padding: 1rem; border-radius: 8px; }
    .djb-panel.deck-a { border-top: 3px solid #00d4ff; }
    .djb-panel.deck-b { border-top: 3px solid #ff006e; }
    .djb-panel.mixer { border-top: 3px solid #ffbe0b; }
    .djb-panel.selected { box-shadow: 0 0 16px rgba(0, 212, 255, 0.4); }
    .djb-panel h3 { margin-top: 0; font-size: 0.85rem; color: #00d4ff; text-transform: uppercase;
                    letter-spacing: 1px; }
    .djb-panel.deck-b h3 { color: #ff006e; }
    .djb-now { font: 1.05rem 'JetBrains Mono', monospace; padding: 0.4rem 0; min-height: 1.5rem; }
    .djb-waveform { display: flex; gap: 1px; height: 40px; align-items: end;
                    background: #0a0a0f; padding: 4px; border-radius: 4px; margin: 0.5rem 0; }
    .djb-bar { flex: 1; background: #00d4ff; opacity: 0.5; min-height: 2px; }
    .djb-panel.deck-b .djb-bar { background: #ff006e; }
    .djb-bar.active { opacity: 1; }
    .djb-wave-canvas { width: 100%; height: 40px; background: #0a0a0f;
                       border-radius: 4px; margin: 0.5rem 0; display: block; }
    .djb-spectrum { display: flex; gap: 1px; height: 30px; align-items: end;
                    background: #0a0a0f; padding: 2px; border-radius: 4px;
                    margin-bottom: 0.5rem; }
    .djb-meta { font-size: 0.75rem; color: #ffbe0b; padding: 0.2rem 0; }
    .djb-list { max-height: 140px; overflow-y: auto; font: 0.8rem monospace; }
    .djb-list.lib { max-height: 220px; }
    .djb-row { display: grid; grid-template-columns: 1fr; padding: 0.25rem 0.4rem;
               cursor: pointer; border-radius: 3px; }
    .djb-row:hover { background: rgba(0, 212, 255, 0.1); }
    .djb-search { width: 100%; padding: 0.4rem; background: #0a0a0f;
                  border: 1px solid #3a3a4e; color: #e8e8f0; border-radius: 4px;
                  margin-bottom: 0.5rem; }
    .djb-empty { color: #888; font-style: italic; padding: 1rem; text-align: center; }
    .djb-library { position: relative; }
    .djb-controls { display: flex; gap: 0.5rem; margin-top: 0.5rem; }
    .djb-fader { width: 100%; }
    .djb-eq { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 0.5rem; margin-top: 0.5rem; }
    .djb-eq label { font-size: 0.7rem; color: #aaa; display: flex; flex-direction: column; align-items: center; }
    .djb-eq input { width: 100%; }
    .djb-mixer-section { margin-bottom: 1rem; }
    .djb-mixer-section label { font-size: 0.75rem; color: #aaa; }
    .djb-cf { background: linear-gradient(to right, #00d4ff, #1a1a2e 50%, #ff006e);
              border-radius: 4px; height: 10px; }
    .djb-lib-row { display: grid; grid-template-columns: 50px 1fr 1fr 60px 100px 50px 50px;
                   gap: 0.5rem; padding: 0.3rem 0.4rem; cursor: pointer;
                   border-radius: 3px; align-items: center; }
    .djb-lib-row:hover { background: rgba(0, 212, 255, 0.1); }
    .djb-lib-btn { padding: 0.15rem 0.4rem; font-size: 0.7rem; }
    .djb-lib-btn.a { color: #00d4ff; border-color: #00d4ff; }
    .djb-lib-btn.b { color: #ff006e; border-color: #ff006e; }
    .djb-play-btn { padding: 0.25rem 0.5rem; font-size: 0.85rem; font-weight: bold;
                    background: #00d4ff; color: #001a2e; border: none; border-radius: 4px;
                    cursor: pointer; }
    .djb-play-btn:hover { background: #5fe3ff; }
    .djb-play-btn:disabled { background: #444; color: #888; cursor: not-allowed; }
    .djb-howto { background: rgba(0, 212, 255, 0.06); border: 1px solid rgba(0, 212, 255, 0.3);
                 padding: 1rem; border-radius: 6px; margin-bottom: 1rem; font-size: 0.85rem; }
    .djb-howto strong { color: #00d4ff; }
    .djb-howto ol { margin: 0.5rem 0 0 1.25rem; padding: 0; }
    .djb-howto li { margin: 0.25rem 0; }
    .djb-help { background: #1a1a2e; padding: 1rem; border-radius: 8px;
                margin-top: 1rem; border-left: 3px solid #00ff88; }
    .djb-help h3 { color: #00ff88; margin-top: 0; font-size: 0.85rem;
                   text-transform: uppercase; letter-spacing: 1px; }
    .djb-help-row { display: flex; gap: 0.75rem; align-items: center;
                    margin-bottom: 0.75rem; flex-wrap: wrap; }
    .djb-tunein { padding: 0.6rem 1.2rem; background: #00ff88; color: #001a0c;
                  border-radius: 6px; border: none; font-weight: 600;
                  text-decoration: none; cursor: pointer; font-size: 0.95rem;
                  display: inline-block; }
    .djb-tunein:hover { background: #00cc6e; }
    .djb-help p { margin: 0.4rem 0; color: #c8c8d0; font-size: 0.85rem;
                  line-height: 1.4; }
    .djb-callout { background: #3a2e0a; border: 1px solid #ffbe0b;
                   border-radius: 6px; padding: 0.7rem 0.9rem;
                   color: #ffe9a8; font-size: 0.85rem; margin-top: 0.6rem; }
  </style>
</head>

<div x-data>
  <template x-if="$store.djBoothStore">
    <div x-init="$store.djBoothStore.onOpen()" x-destroy="$store.djBoothStore.cleanup()" class="djb-wrap">

      <div class="djb-header">
        <h2 x-text="$store.djBoothStore.status?.is_running ? '🎧 ON AIR' : '🎧 DJ Booth'"
            style="margin: 0 1rem 0 0; font-size: 1.05rem;"></h2>
        <span class="djb-badge"
              :class="{ fallback: $store.djBoothStore.status?.engine === 'ffmpeg' }"
              x-text="$store.djBoothStore.engineLabel"></span>
        <div class="djb-listeners" x-show="$store.djBoothStore.isRunning">
          <span class="djb-pulse"></span>
          <span x-text="$store.djBoothStore.listenerCount + ' listening'"></span>
        </div>
        <div class="djb-stream-url"
             x-text="$store.djBoothStore.status?.stream_url || ''"
             x-show="$store.djBoothStore.isRunning"></div>
        <button class="djb-btn" x-show="$store.djBoothStore.isRunning"
                @click="$store.djBoothStore.copyStreamUrl()">Copy URL</button>
        <button class="djb-btn" x-show="$store.djBoothStore.isRunning"
                @click="$store.djBoothStore.diagnose()"
                title="Run a connectivity check on the stream">🩺 Diagnose</button>
        <button class="djb-btn start" x-show="!$store.djBoothStore.isRunning"
                @click="$store.djBoothStore.start()">Start</button>
        <button class="djb-btn stop" x-show="$store.djBoothStore.isRunning"
                @click="$store.djBoothStore.stop()">Stop</button>
      </div>

      <!-- Inline error/warning banner — shown when something went wrong on Start
           or when the diagnostic flagged a problem. Plain language, dismissible. -->
      <div x-show="$store.djBoothStore.status?.error"
           style="background: rgba(255, 0, 110, 0.15); border: 1px solid #ff006e;
                  padding: 0.75rem 1rem; border-radius: 6px; margin-bottom: 1rem;
                  display: flex; align-items: center; gap: 0.75rem;">
        <span style="font-size: 1.2rem;">⚠️</span>
        <div style="flex: 1;">
          <strong>Something went wrong:</strong>
          <span x-text="$store.djBoothStore.status?.error" style="word-break: break-word;"></span>
        </div>
        <button class="djb-btn sm"
                @click="$store.djBoothStore.diagnose()">Diagnose</button>
      </div>

      <div class="djb-grid">

        <!-- DECK A -->
        <div class="djb-panel deck-a"
             :class="{ selected: $store.djBoothStore.selectedDeck === 'a' }"
             @click="$store.djBoothStore.selectDeck('a')">
          <h3>Deck A</h3>
          <div class="djb-now" x-text="$store.djBoothStore.deckA.current_track || '— silence —'"></div>
          <div class="djb-meta" x-show="$store.djBoothStore.deckA.current_track">
            Use library Analyze to populate BPM/key
          </div>
          <canvas class="djb-wave-canvas" width="400" height="40"
                  x-ref="waveA"
                  x-effect="$store.djBoothStore.drawWaveform($refs.waveA, 'a')"></canvas>
          <h3>Queue (<span x-text="$store.djBoothStore.deckA.queue.length"></span>)</h3>
          <div class="djb-list">
            <template x-for="(p, i) in $store.djBoothStore.deckA.queue" :key="i">
              <div class="djb-row"><span x-text="p.split('/').pop()"></span></div>
            </template>
            <div class="djb-empty" x-show="!$store.djBoothStore.deckA.queue.length">queue empty</div>
          </div>
          <div class="djb-controls">
            <button class="djb-btn sm" @click.stop="$store.djBoothStore.skip('a')"
                    :disabled="!$store.djBoothStore.isRunning">Skip</button>
            <button class="djb-btn sm" @click.stop="$store.djBoothStore.clearQueue('a')"
                    :disabled="!$store.djBoothStore.isRunning">Clear</button>
          </div>
          <label style="font-size: 0.75rem; color: #aaa; display: block; margin-top: 0.5rem;">
            Volume <span x-text="$store.djBoothStore.deckA.volume.toFixed(2)"></span>
            <input class="djb-fader" type="range" min="0" max="2" step="0.05"
                   :value="$store.djBoothStore.deckA.volume"
                   @input="$store.djBoothStore.setVolume('deck_a', parseFloat($event.target.value))">
          </label>
          <div class="djb-eq">
            <label>Low <span x-text="$store.djBoothStore.deckA.eq_low.toFixed(1)"></span>
              <input type="range" min="-12" max="12" step="0.5"
                     :value="$store.djBoothStore.deckA.eq_low"
                     @change="$store.djBoothStore.setEQ('a',
                                parseFloat($event.target.value),
                                $store.djBoothStore.deckA.eq_mid,
                                $store.djBoothStore.deckA.eq_high)"></label>
            <label>Mid <span x-text="$store.djBoothStore.deckA.eq_mid.toFixed(1)"></span>
              <input type="range" min="-12" max="12" step="0.5"
                     :value="$store.djBoothStore.deckA.eq_mid"
                     @change="$store.djBoothStore.setEQ('a',
                                $store.djBoothStore.deckA.eq_low,
                                parseFloat($event.target.value),
                                $store.djBoothStore.deckA.eq_high)"></label>
            <label>High <span x-text="$store.djBoothStore.deckA.eq_high.toFixed(1)"></span>
              <input type="range" min="-12" max="12" step="0.5"
                     :value="$store.djBoothStore.deckA.eq_high"
                     @change="$store.djBoothStore.setEQ('a',
                                $store.djBoothStore.deckA.eq_low,
                                $store.djBoothStore.deckA.eq_mid,
                                parseFloat($event.target.value))"></label>
          </div>
          <label style="font-size: 0.75rem; color: #aaa; display: block; margin-top: 0.5rem;">
            Pitch <span x-text="(($store.djBoothStore.deckA.pitch || 0)).toFixed(2) + ' st'"></span>
            <input class="djb-fader" type="range" min="-6" max="6" step="0.1"
                   :value="$store.djBoothStore.deckA.pitch || 0"
                   @input="$store.djBoothStore.setPitch('a', parseFloat($event.target.value))">
          </label>
        </div>

        <!-- MIXER -->
        <div class="djb-panel mixer">
          <h3 style="color: #ffbe0b;">Mixer</h3>

          <div class="djb-spectrum">
            <template x-for="(b, i) in $store.djBoothStore.spectrumBars" :key="i">
              <div :style="`flex:1; background: hsl(${200 + i*2}, 90%, 55%); height: ${Math.max(2, b*100)}%`"></div>
            </template>
          </div>

          <div class="djb-mixer-section">
            <label>Master <span x-text="$store.djBoothStore.mixer.master_volume.toFixed(2)"></span>
              <input class="djb-fader" type="range" min="0" max="1.5" step="0.05"
                     :value="$store.djBoothStore.mixer.master_volume"
                     @input="$store.djBoothStore.setVolume('master', parseFloat($event.target.value))"></label>
          </div>

          <div class="djb-mixer-section">
            <label>Crossfader (A ←→ B) <span x-text="$store.djBoothStore.mixer.crossfader.toFixed(2)"></span></label>
            <input class="djb-fader" type="range" min="0" max="1" step="0.01"
                   :value="$store.djBoothStore.mixer.crossfader"
                   @input="$store.djBoothStore.setCrossfader(parseFloat($event.target.value))">
            <div class="djb-cf"></div>
          </div>

          <div class="djb-mixer-section">
            <h4 style="font-size: 0.75rem; color: #ffbe0b; margin: 0.5rem 0 0.25rem;">EFX</h4>
            <label>Reverb <span x-text="(($store.djBoothStore.efx.reverb_wet||0)*100).toFixed(0)+'%'"></span>
              <input class="djb-fader" type="range" min="0" max="1" step="0.01"
                     :value="$store.djBoothStore.efx.reverb_wet"
                     @input="$store.djBoothStore.setEFX('reverb','wet',parseFloat($event.target.value))"></label>
            <label>Delay <span x-text="(($store.djBoothStore.efx.delay_wet||0)*100).toFixed(0)+'%'"></span>
              <input class="djb-fader" type="range" min="0" max="1" step="0.01"
                     :value="$store.djBoothStore.efx.delay_wet"
                     @input="$store.djBoothStore.setEFX('delay','wet',parseFloat($event.target.value))"></label>
            <label>Filter <span x-text="Math.round($store.djBoothStore.efx.filter_freq) + ' Hz'"></span>
              <input class="djb-fader" type="range" min="20" max="20000" step="10"
                     :value="$store.djBoothStore.efx.filter_freq"
                     @input="$store.djBoothStore.setEFX('filter','freq',parseFloat($event.target.value))"></label>
          </div>

          <div class="djb-mixer-section">
            <h4 style="font-size: 0.75rem; color: #ffbe0b; margin: 0.5rem 0 0.25rem;">Announce</h4>
            <input class="djb-search" type="text" placeholder="say something to the listeners…"
                   x-ref="ttsInput">
            <button class="djb-btn sm" style="margin-top: 0.25rem;"
                    @click="$store.djBoothStore.announce($refs.ttsInput.value); $refs.ttsInput.value=''">Speak</button>
          </div>

          <div style="margin-top: 1rem; font-size: 0.75rem; color: #888;">
            Selected deck: <strong x-text="$store.djBoothStore.selectedDeck.toUpperCase()"></strong>
            <br>Library double-click queues here.
          </div>
        </div>

        <!-- DECK B -->
        <div class="djb-panel deck-b"
             :class="{ selected: $store.djBoothStore.selectedDeck === 'b' }"
             @click="$store.djBoothStore.selectDeck('b')">
          <h3>Deck B</h3>
          <div class="djb-now" x-text="$store.djBoothStore.deckB.current_track || '— silence —'"></div>
          <div class="djb-meta" x-show="$store.djBoothStore.deckB.current_track">
            Use library Analyze to populate BPM/key
          </div>
          <canvas class="djb-wave-canvas" width="400" height="40"
                  x-ref="waveB"
                  x-effect="$store.djBoothStore.drawWaveform($refs.waveB, 'b')"></canvas>
          <h3>Queue (<span x-text="$store.djBoothStore.deckB.queue.length"></span>)</h3>
          <div class="djb-list">
            <template x-for="(p, i) in $store.djBoothStore.deckB.queue" :key="i">
              <div class="djb-row"><span x-text="p.split('/').pop()"></span></div>
            </template>
            <div class="djb-empty" x-show="!$store.djBoothStore.deckB.queue.length">queue empty</div>
          </div>
          <div class="djb-controls">
            <button class="djb-btn sm" @click.stop="$store.djBoothStore.skip('b')"
                    :disabled="!$store.djBoothStore.isRunning">Skip</button>
            <button class="djb-btn sm" @click.stop="$store.djBoothStore.clearQueue('b')"
                    :disabled="!$store.djBoothStore.isRunning">Clear</button>
          </div>
          <label style="font-size: 0.75rem; color: #aaa; display: block; margin-top: 0.5rem;">
            Volume <span x-text="$store.djBoothStore.deckB.volume.toFixed(2)"></span>
            <input class="djb-fader" type="range" min="0" max="2" step="0.05"
                   :value="$store.djBoothStore.deckB.volume"
                   @input="$store.djBoothStore.setVolume('deck_b', parseFloat($event.target.value))">
          </label>
          <div class="djb-eq">
            <label>Low <span x-text="$store.djBoothStore.deckB.eq_low.toFixed(1)"></span>
              <input type="range" min="-12" max="12" step="0.5"
                     :value="$store.djBoothStore.deckB.eq_low"
                     @change="$store.djBoothStore.setEQ('b',
                                parseFloat($event.target.value),
                                $store.djBoothStore.deckB.eq_mid,
                                $store.djBoothStore.deckB.eq_high)"></label>
            <label>Mid <span x-text="$store.djBoothStore.deckB.eq_mid.toFixed(1)"></span>
              <input type="range" min="-12" max="12" step="0.5"
                     :value="$store.djBoothStore.deckB.eq_mid"
                     @change="$store.djBoothStore.setEQ('b',
                                $store.djBoothStore.deckB.eq_low,
                                parseFloat($event.target.value),
                                $store.djBoothStore.deckB.eq_high)"></label>
            <label>High <span x-text="$store.djBoothStore.deckB.eq_high.toFixed(1)"></span>
              <input type="range" min="-12" max="12" step="0.5"
                     :value="$store.djBoothStore.deckB.eq_high"
                     @change="$store.djBoothStore.setEQ('b',
                                $store.djBoothStore.deckB.eq_low,
                                $store.djBoothStore.deckB.eq_mid,
                                parseFloat($event.target.value))"></label>
          </div>
          <label style="font-size: 0.75rem; color: #aaa; display: block; margin-top: 0.5rem;">
            Pitch <span x-text="(($store.djBoothStore.deckB.pitch || 0)).toFixed(2) + ' st'"></span>
            <input class="djb-fader" type="range" min="-6" max="6" step="0.1"
                   :value="$store.djBoothStore.deckB.pitch || 0"
                   @input="$store.djBoothStore.setPitch('b', parseFloat($event.target.value))">
          </label>
        </div>
      </div>

      <!-- LIBRARY -->
      <div class="djb-panel djb-library" style="margin-top: 1rem;"
           x-data="{ dragOver: false }"
           @dragenter.prevent="dragOver = true"
           @dragover.prevent="dragOver = true"
           @dragleave.prevent="dragOver = false"
           @drop.prevent="dragOver = false; $store.djBoothStore.uploadFiles($event.dataTransfer.files)">
        <h3 style="display: flex; align-items: center; gap: 0.5rem;">
          <span>Library</span>
          <span style="font-size: 0.75rem; color: #888; font-weight: normal; text-transform: none; letter-spacing: 0;"
                x-text="`${$store.djBoothStore.status?.library_count || 0} tracks · last scanned ${$store.djBoothStore.lastScanLabel}`"></span>
          <span style="margin-left: auto; display: flex; gap: 0.4rem;">
            <input type="file" multiple accept="audio/*,.mp3,.flac,.ogg,.oga,.m4a,.aac,.wav,.aiff,.aif"
                   x-ref="fileInput" style="display: none"
                   @change="$store.djBoothStore.uploadFiles($event.target.files); $event.target.value=''">
            <button class="djb-btn sm" @click="$refs.fileInput.click()"
                    :disabled="$store.djBoothStore.isUploading">
              <span x-show="!$store.djBoothStore.isUploading">+ Add Music</span>
              <span x-show="$store.djBoothStore.isUploading">Uploading...</span>
            </button>
            <button class="djb-btn sm" @click="$store.djBoothStore.scanLibrary()"
                    :disabled="$store.djBoothStore.isScanning">
              <span x-show="!$store.djBoothStore.isScanning">⟳ Rescan</span>
              <span x-show="$store.djBoothStore.isScanning">Scanning...</span>
            </button>
          </span>
        </h3>

        <!-- Drop zone overlay shown when user drags files over the panel -->
        <div x-show="dragOver"
             style="position: absolute; inset: 0; background: rgba(0, 212, 255, 0.15);
                    border: 2px dashed #00d4ff; border-radius: 8px; display: flex;
                    align-items: center; justify-content: center; pointer-events: none;
                    font-size: 1.2rem; color: #00d4ff; z-index: 5;">
          Drop audio files to add them to the library
        </div>

        <!-- Per-path scan results so users can see WHERE tracks were found -->
        <details style="margin-bottom: 0.5rem; font-size: 0.75rem; color: #888;"
                 x-show="$store.djBoothStore.scannedPaths.length">
          <summary style="cursor: pointer;">Scanned folders</summary>
          <ul style="margin: 0.25rem 0 0 1rem; padding: 0; list-style: none;">
            <template x-for="p in $store.djBoothStore.scannedPaths" :key="p">
              <li style="font-family: monospace;">
                <span x-text="p"></span>
                — <strong x-text="$store.djBoothStore.scannedPathCounts[p] || 0"></strong> tracks
              </li>
            </template>
          </ul>
        </details>

        <!-- How-to-play callout: visible whenever the stream isn't running.
             Most users see this once after Add Music and before clicking Start. -->
        <div class="djb-howto" x-show="!$store.djBoothStore.isRunning && $store.djBoothStore.library.tracks.length">
          <strong>Ready to play! Quick guide:</strong>
          <ol>
            <li>Click the green <strong>Start</strong> button at the top of this panel.</li>
            <li>Click the blue <strong>▶ Play</strong> button on any track below.</li>
            <li>Click <strong>🌐 Share Online</strong> in Listener Help to get a public link anyone can listen to.</li>
          </ol>
        </div>

        <input class="djb-search" type="text" placeholder="search title / artist / album / genre"
               :value="$store.djBoothStore.librarySearch"
               @input.debounce.300ms="$store.djBoothStore.onSearchChange($event.target.value)">
        <div class="djb-list lib">
          <template x-for="t in $store.djBoothStore.library.tracks" :key="t.path">
            <div class="djb-lib-row" :title="t.path"
                 @dblclick="$store.djBoothStore.playNow(t.path)">
              <button class="djb-play-btn"
                      @click.stop="$store.djBoothStore.playNow(t.path)"
                      :disabled="!$store.djBoothStore.isRunning"
                      :title="$store.djBoothStore.isRunning ? 'Play this track now on the selected deck' : 'Click Start at the top first'">
                ▶ Play
              </button>
              <span x-text="t.title"></span>
              <span x-text="t.artist" style="color:#aaa;"></span>
              <span x-text="t.format" style="color:#666;"></span>
              <div>
                <span x-show="t.bpm" x-text="t.bpm.toFixed(0) + ' ' + (t.key || '')"
                      style="font-size: 0.7rem; color: #ffbe0b;"></span>
                <button class="djb-btn djb-lib-btn" x-show="!t.bpm"
                        @click.stop="$store.djBoothStore.analyzeTrack(t.path)"
                        title="Analyze BPM + key + waveform">⚡</button>
              </div>
              <button class="djb-btn djb-lib-btn a"
                      @click.stop="$store.djBoothStore.queueTrack(t.path, 'a')"
                      title="Queue on Deck A (without skipping current track)">+A</button>
              <button class="djb-btn djb-lib-btn b"
                      @click.stop="$store.djBoothStore.queueTrack(t.path, 'b')"
                      title="Queue on Deck B">+B</button>
            </div>
          </template>
          <div class="djb-empty" x-show="!$store.djBoothStore.library.tracks.length"
               style="padding: 1.5rem 1rem;">
            <strong>No tracks yet.</strong><br>
            Drag-and-drop audio files anywhere on this panel,<br>
            or click <em>+ Add Music</em> above to pick files from your computer.
          </div>
        </div>
      </div>

      <!-- LISTENER HELP — shown only when the stream is live -->
      <div class="djb-help" x-show="$store.djBoothStore.isRunning">
        <h3>Listener Help</h3>

        <!-- Built-in player: lets the DJ hear what listeners hear, with no
             external app. Most reliable signal that the stream actually works. -->
        <div style="background: #0a0a0f; padding: 0.75rem; border-radius: 6px;
                    margin-bottom: 0.75rem; display: flex; gap: 0.75rem;
                    align-items: center; flex-wrap: wrap;">
          <strong style="color: #00d4ff; font-size: 0.85rem; white-space: nowrap;">🎧 Listen here:</strong>
          <audio controls preload="none" style="flex: 1; min-width: 280px;"
                 :src="$store.djBoothStore.status?.stream_url || ''"></audio>
          <span style="font-size: 0.75rem; color: #888;">
            Press play. If you hear audio, the stream is working.
          </span>
        </div>

        <!-- Connection status grid — replaces the old vague hint with a clear
             per-layer health indicator updated by the Diagnose button. -->
        <div x-show="$store.djBoothStore.diagnoseReport"
             style="display: grid; grid-template-columns: 1fr 1fr; gap: 0.4rem;
                    background: #0a0a0f; padding: 0.5rem 0.75rem; border-radius: 4px;
                    margin-bottom: 0.75rem; font-size: 0.8rem;">
          <div>Status endpoint:
            <span :style="`color: ${$store.djBoothStore.diagnoseReport?.status_endpoint_ok ? '#00ff88' : '#ff006e'}`"
                  x-text="$store.djBoothStore.diagnoseReport?.status_endpoint_ok ? '✓ ok' : ('✗ ' + ($store.djBoothStore.diagnoseReport?.status_endpoint_error || 'fail'))"></span>
          </div>
          <div>Stream mount:
            <span :style="`color: ${$store.djBoothStore.diagnoseReport?.mount_ok ? '#00ff88' : '#ff006e'}`"
                  x-text="$store.djBoothStore.diagnoseReport?.mount_ok ? '✓ ok' : ('✗ ' + ($store.djBoothStore.diagnoseReport?.mount_error || 'fail'))"></span>
          </div>
          <div>Audio engine:
            <span :style="`color: ${$store.djBoothStore.diagnoseReport?.engine_alive ? '#00ff88' : '#ff006e'}`"
                  x-text="$store.djBoothStore.diagnoseReport?.engine_alive ? '✓ running' : '✗ not running'"></span>
          </div>
          <div>Listeners connected:
            <strong x-text="$store.djBoothStore.diagnoseReport?.listener_count || 0"></strong>
          </div>
        </div>

        <!-- Local link — works on this computer / same network -->
        <div class="djb-help-row">
          <a class="djb-tunein"
             :href="$store.djBoothStore.status?.stream_url || '#'"
             target="_blank" rel="noopener">▶ Open in player (LAN)</a>
          <button class="djb-btn"
                  @click="$store.djBoothStore.copyStreamUrl()">Copy LAN URL</button>
          <span style="font-family: monospace; font-size: 0.8rem; color: #888;"
                x-text="$store.djBoothStore.status?.stream_url || ''"></span>
        </div>

        <!-- Share Online — Cloudflare quick tunnel for internet listeners -->
        <div class="djb-help-row" style="margin-top: 0.75rem;">
          <template x-if="!$store.djBoothStore.hasPublicUrl && !$store.djBoothStore.publicUrlStarting">
            <button class="djb-btn start"
                    @click="$store.djBoothStore.startShare()">🌐 Share Online</button>
          </template>
          <template x-if="$store.djBoothStore.publicUrlStarting">
            <button class="djb-btn" disabled>Creating public link...</button>
          </template>
          <template x-if="$store.djBoothStore.hasPublicUrl">
            <div style="display: flex; gap: 0.5rem; align-items: center; flex-wrap: wrap; flex: 1;">
              <a class="djb-tunein"
                 :href="$store.djBoothStore.publicUrl"
                 target="_blank" rel="noopener">▶ Tune in (public)</a>
              <button class="djb-btn"
                      @click="$store.djBoothStore.copyPublicUrl()">Copy Public URL</button>
              <button class="djb-btn stop"
                      @click="$store.djBoothStore.stopShare()">Stop Sharing</button>
              <span style="font-family: monospace; font-size: 0.8rem; color: #00d4ff; word-break: break-all; flex: 1;"
                    x-text="$store.djBoothStore.publicUrl"></span>
            </div>
          </template>
        </div>

        <p>
          The <strong>LAN URL</strong> works on this computer and on the same
          local network. The <strong>Share Online</strong> button creates a free
          public link via Cloudflare — anyone with the link can listen, no
          router setup required. The public link disappears when you stop the
          stream.
        </p>

        <div class="djb-callout"
             x-show="$store.djBoothStore.publicUrlError">
          Couldn't create the public link: <span x-text="$store.djBoothStore.publicUrlError"></span>.
          You can still share the LAN URL with anyone on your network, or click Share Online again to retry.
        </div>

        <div class="djb-callout"
             x-show="$store.djBoothStore.shouldShowConnectivityHint && !$store.djBoothStore.hasPublicUrl">
          Nobody has connected yet. If you want to share this beyond your
          computer, click <strong>Share Online</strong> above to get a public link
          anyone can use.
        </div>
      </div>

    </div>
  </template>
</div>
