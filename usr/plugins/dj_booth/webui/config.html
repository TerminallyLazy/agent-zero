<html>
<head>
    <title>DJ Booth</title>
</head>
<body>
    <div x-data>
        <template x-if="config">
            <div class="dj-booth-config">
                <div class="section-title">DJ Booth</div>
                <div class="section-description">
                    Local Icecast2 streaming server. Tune in from any ICY-compatible client (VLC, Winamp, browser).
                </div>

                <div class="dj-booth-card">
                    <div class="section-title">Stream</div>

                    <div class="field">
                        <div class="field-label">
                            <div class="field-title">Stream Name</div>
                            <div class="field-description">The name listeners see in their music player. Defaults to "Agent Zero Radio".</div>
                        </div>
                        <div class="field-control">
                            <input type="text" x-model="config.stream_name" />
                        </div>
                    </div>

                    <div class="field">
                        <div class="field-label">
                            <div class="field-title">Description</div>
                            <div class="field-description">A short tagline shown to listeners alongside the stream name.</div>
                        </div>
                        <div class="field-control">
                            <input type="text" x-model="config.stream_description" />
                        </div>
                    </div>

                    <div class="field">
                        <div class="field-label">
                            <div class="field-title">Genre</div>
                            <div class="field-description">Optional genre tag (e.g. "Electronic", "Talk", "Mixed"). Listeners see it next to the name.</div>
                        </div>
                        <div class="field-control">
                            <input type="text" x-model="config.stream_genre" />
                        </div>
                    </div>

                    <div class="field">
                        <div class="field-label">
                            <div class="field-title">Stream URL</div>
                            <div class="field-description">Where the stream broadcasts. Most players will tune in to this URL plus the mount point below.</div>
                        </div>
                        <div class="field-control">
                            <input type="text" x-model="config.stream_url" />
                        </div>
                    </div>

                    <div class="field">
                        <div class="field-label">
                            <div class="field-title">Mount Point</div>
                            <div class="field-description">The path tacked onto the stream URL (default <code>/stream</code>). Most users should leave this alone.</div>
                        </div>
                        <div class="field-control">
                            <input type="text" x-model="config.mount" />
                        </div>
                    </div>

                    <div class="field">
                        <div class="field-label">
                            <div class="field-title">Public Listing</div>
                            <div class="field-description">If on, the stream is advertised on public Icecast directories. Off keeps it private to people you share the URL with.</div>
                        </div>
                        <div class="field-control">
                            <label class="toggle">
                                <input type="checkbox" x-model="config.public_listing" />
                                <span class="toggler"></span>
                            </label>
                        </div>
                    </div>
                </div>

                <div class="dj-booth-card">
                    <div class="section-title">Server</div>

                    <div class="field">
                        <div class="field-label">
                            <div class="field-title">Music Folder</div>
                            <div class="field-description">Folder where DJ Booth looks for your music. Drop your audio files in here, then click Scan in the booth.</div>
                        </div>
                        <div class="field-control">
                            <input type="text" x-model="config.music_dir" />
                        </div>
                    </div>

                    <div class="field">
                        <div class="field-label">
                            <div class="field-title">Stream Port</div>
                            <div class="field-description">The port listeners connect to. Default 8000. If something else is using it, pick another (e.g. 8800). Whoever set up Agent Zero may need to forward this port for sharing beyond your own computer.</div>
                        </div>
                        <div class="field-control">
                            <input type="number" x-model.number="config.icecast_port" />
                        </div>
                    </div>

                    <div class="field">
                        <div class="field-label">
                            <div class="field-title">Source Password</div>
                            <div class="field-description">Internal password the booth uses to push audio. You can change it but most users don't need to.</div>
                        </div>
                        <div class="field-control">
                            <input type="password" x-model="config.icecast_source_password" />
                        </div>
                    </div>

                    <div class="field">
                        <div class="field-label">
                            <div class="field-title">Admin Password</div>
                            <div class="field-description">Password for the Icecast admin page. Also internal — listeners never see it.</div>
                        </div>
                        <div class="field-control">
                            <input type="password" x-model="config.icecast_admin_password" />
                        </div>
                    </div>

                    <div class="field">
                        <div class="field-label">
                            <div class="field-title">Max Listeners</div>
                            <div class="field-description">Cap on simultaneous listeners. 100 is plenty for personal use.</div>
                        </div>
                        <div class="field-control">
                            <input type="number" x-model.number="config.max_listeners" />
                        </div>
                    </div>
                </div>

                <div class="dj-booth-card">
                    <div class="section-title">Audio</div>

                    <div class="field">
                        <div class="field-label">
                            <div class="field-title">Bitrate</div>
                            <div class="field-description">Audio quality. Higher sounds better but uses more bandwidth. 192 kbps is a good default for music.</div>
                        </div>
                        <div class="field-control">
                            <select x-model.number="config.bitrate">
                                <option :value="64">64 kbps (low — talk radio)</option>
                                <option :value="128">128 kbps (standard)</option>
                                <option :value="192">192 kbps (recommended)</option>
                                <option :value="320">320 kbps (high)</option>
                            </select>
                        </div>
                    </div>

                    <div class="field">
                        <div class="field-label">
                            <div class="field-title">Sample Rate</div>
                            <div class="field-description">How often audio is sampled per second. 44100 Hz is CD quality and works for almost everyone.</div>
                        </div>
                        <div class="field-control">
                            <select x-model.number="config.sample_rate">
                                <option :value="22050">22050 Hz</option>
                                <option :value="44100">44100 Hz (CD quality)</option>
                                <option :value="48000">48000 Hz</option>
                            </select>
                        </div>
                    </div>
                </div>
            </div>
        </template>
    </div>

    <style>
        .dj-booth-config {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .dj-booth-card {
            border: 1px solid var(--color-border);
            border-radius: 8px;
            padding: 16px;
        }
    </style>
</body>
</html>
