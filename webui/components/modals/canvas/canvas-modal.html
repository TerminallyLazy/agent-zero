<html>
<head>
  <title>Canvas Workspace</title>
  <script type="module">
    import { store } from "/components/modals/canvas/canvas-store.js";
  </script>
</head>

<body>
  <div x-data>
    <template x-if="$store.canvasStore">
      <div class="canvas-modal-container">
        <!-- Header with controls -->
        <div class="canvas-header">
          <div class="canvas-title">
            <svg xmlns="http://www.w3.org/2000/svg" height="20" viewBox="0 -960 960 960" width="20" fill="currentColor">
              <path d="M200-120q-33 0-56.5-23.5T120-200v-560q0-33 23.5-56.5T200-840h560q33 0 56.5 23.5T840-760v560q0 33-23.5 56.5T760-120H200Zm0-80h560v-480H200v480Zm40-40h200v-200H240v200Zm240 0h200v-80H480v80Zm0-120h200v-80H480v80Zm-240-120h440v-120H240v120Z"/>
            </svg>
            <span>Canvas Workspace</span>
          </div>

          <div class="canvas-status">
            <template x-if="$store.canvasStore.isRunning">
              <div class="status-badge running">
                <span class="status-dot"></span>
                <span>Running</span>
              </div>
            </template>
            <template x-if="!$store.canvasStore.isRunning">
              <div class="status-badge stopped">
                <span class="status-dot"></span>
                <span>Stopped</span>
              </div>
            </template>
          </div>

          <div class="canvas-controls">
            <button
              class="canvas-btn"
              @click="$store.canvasStore.reloadIframe()"
              title="Refresh preview"
            >
              <svg xmlns="http://www.w3.org/2000/svg" height="18" viewBox="0 -960 960 960" width="18" fill="currentColor">
                <path d="M480-160q-134 0-227-93t-93-227q0-134 93-227t227-93q69 0 132 28.5T720-690v-110h80v280H520v-80h168q-32-56-87.5-88T480-720q-100 0-170 70t-70 170q0 100 70 170t170 70q77 0 139-44t87-116h84q-28 106-114 173t-196 67Z"/>
              </svg>
            </button>
            <button
              class="canvas-btn"
              @click="$store.canvasStore.screenshot()"
              title="Take screenshot"
            >
              <svg xmlns="http://www.w3.org/2000/svg" height="18" viewBox="0 -960 960 960" width="18" fill="currentColor">
                <path d="M480-260q75 0 127.5-52.5T660-440q0-75-52.5-127.5T480-620q-75 0-127.5 52.5T300-440q0 75 52.5 127.5T480-260Zm0-80q-42 0-71-29t-29-71q0-42 29-71t71-29q42 0 71 29t29 71q0 42-29 71t-71 29ZM160-120q-33 0-56.5-23.5T80-200v-480q0-33 23.5-56.5T160-760h126l74-80h240l74 80h126q33 0 56.5 23.5T880-680v480q0 33-23.5 56.5T800-120H160Z"/>
              </svg>
            </button>
            <button
              class="canvas-btn close-btn"
              @click="$store.canvasStore.close()"
              title="Close canvas"
            >
              <svg xmlns="http://www.w3.org/2000/svg" height="18" viewBox="0 -960 960 960" width="18" fill="currentColor">
                <path d="m256-200-56-56 224-224-224-224 56-56 224 224 224-224 56 56-224 224 224 224-56 56-224-224-224 224Z"/>
              </svg>
            </button>
          </div>
        </div>

        <!-- Main content area -->
        <div class="canvas-content">
          <!-- Preview iframe -->
          <div class="canvas-preview">
            <template x-if="$store.canvasStore.url">
              <iframe
                id="canvas-preview-iframe"
                :src="$store.canvasStore.url"
                frameborder="0"
                sandbox="allow-scripts allow-same-origin allow-forms allow-popups"
              ></iframe>
            </template>
            <template x-if="!$store.canvasStore.url">
              <div class="canvas-placeholder">
                <div class="placeholder-content">
                  <svg xmlns="http://www.w3.org/2000/svg" height="48" viewBox="0 -960 960 960" width="48" fill="currentColor">
                    <path d="M200-120q-33 0-56.5-23.5T120-200v-560q0-33 23.5-56.5T200-840h560q33 0 56.5 23.5T840-760v560q0 33-23.5 56.5T760-120H200Zm0-80h560v-480H200v480Zm40-40h200v-200H240v200Zm240 0h200v-80H480v80Zm0-120h200v-80H480v80Zm-240-120h440v-120H240v120Z"/>
                  </svg>
                  <p>Canvas workspace is not running</p>
                  <button class="start-btn" @click="$store.canvasStore.open()">
                    Start Canvas
                  </button>
                </div>
              </div>
            </template>
          </div>

          <!-- Sidebar with file list -->
          <div class="canvas-sidebar">
            <div class="sidebar-section">
              <div class="sidebar-title">Workspace Files</div>
              <div class="file-list">
                <template x-if="$store.canvasStore.files.length === 0">
                  <div class="no-files">
                    <span>No files yet</span>
                    <span class="hint">Agent will create files here</span>
                  </div>
                </template>
                <template x-for="file in $store.canvasStore.files" :key="file">
                  <div class="file-item" :title="file">
                    <svg xmlns="http://www.w3.org/2000/svg" height="16" viewBox="0 -960 960 960" width="16" fill="currentColor">
                      <path d="M320-240h320v-80H320v80Zm0-160h320v-80H320v80ZM240-80q-33 0-56.5-23.5T160-160v-640q0-33 23.5-56.5T240-880h320l240 240v480q0 33-23.5 56.5T720-80H240Z"/>
                    </svg>
                    <span x-text="file"></span>
                  </div>
                </template>
              </div>
            </div>

            <div class="sidebar-section">
              <div class="sidebar-title">Info</div>
              <div class="info-list">
                <div class="info-item">
                  <span class="info-label">URL:</span>
                  <span class="info-value" x-text="$store.canvasStore.url || 'N/A'"></span>
                </div>
                <div class="info-item">
                  <span class="info-label">Workspace:</span>
                  <span class="info-value truncate" :title="$store.canvasStore.workspace" x-text="$store.canvasStore.workspace || 'N/A'"></span>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </template>
  </div>

  <style>
    .canvas-modal-container {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      background: var(--color-bg-primary);
      overflow: hidden;
    }

    .canvas-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 16px;
      background: var(--color-bg-secondary);
      border-bottom: 1px solid var(--color-border);
      flex-shrink: 0;
    }

    .canvas-title {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 600;
      font-size: 14px;
      color: var(--color-text-primary);
    }

    .canvas-title svg {
      opacity: 0.8;
    }

    .canvas-status {
      display: flex;
      align-items: center;
    }

    .status-badge {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 4px 10px;
      border-radius: 12px;
      font-size: 12px;
      font-weight: 500;
    }

    .status-badge.running {
      background: rgba(0, 200, 83, 0.15);
      color: #00c853;
    }

    .status-badge.stopped {
      background: rgba(255, 82, 82, 0.15);
      color: #ff5252;
    }

    .status-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: currentColor;
    }

    .status-badge.running .status-dot {
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }

    .canvas-controls {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .canvas-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 32px;
      height: 32px;
      border: none;
      border-radius: 6px;
      background: transparent;
      color: var(--color-text-secondary);
      cursor: pointer;
      transition: all 0.2s;
    }

    .canvas-btn:hover {
      background: var(--color-bg-tertiary);
      color: var(--color-text-primary);
    }

    .canvas-btn.close-btn:hover {
      background: rgba(255, 82, 82, 0.15);
      color: #ff5252;
    }

    .canvas-content {
      flex: 1;
      display: flex;
      overflow: hidden;
    }

    .canvas-preview {
      flex: 1;
      position: relative;
      background: #1a1a2e;
    }

    .canvas-preview iframe {
      width: 100%;
      height: 100%;
      border: none;
      background: white;
    }

    .canvas-placeholder {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .placeholder-content {
      text-align: center;
      color: var(--color-text-secondary);
    }

    .placeholder-content svg {
      opacity: 0.3;
      margin-bottom: 16px;
    }

    .placeholder-content p {
      margin-bottom: 16px;
      font-size: 14px;
    }

    .start-btn {
      padding: 10px 20px;
      border: none;
      border-radius: 8px;
      background: linear-gradient(135deg, #7b2cbf 0%, #5a189a 100%);
      color: white;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
    }

    .start-btn:hover {
      transform: translateY(-1px);
      box-shadow: 0 4px 12px rgba(123, 44, 191, 0.3);
    }

    .canvas-sidebar {
      width: 240px;
      background: var(--color-bg-secondary);
      border-left: 1px solid var(--color-border);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .sidebar-section {
      padding: 12px;
      border-bottom: 1px solid var(--color-border);
    }

    .sidebar-section:last-child {
      border-bottom: none;
    }

    .sidebar-title {
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--color-text-tertiary);
      margin-bottom: 8px;
    }

    .file-list {
      display: flex;
      flex-direction: column;
      gap: 2px;
      max-height: 200px;
      overflow-y: auto;
    }

    .file-item {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 6px 8px;
      border-radius: 4px;
      font-size: 12px;
      color: var(--color-text-secondary);
      cursor: default;
    }

    .file-item:hover {
      background: var(--color-bg-tertiary);
    }

    .file-item svg {
      flex-shrink: 0;
      opacity: 0.6;
    }

    .file-item span {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .no-files {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 16px;
      color: var(--color-text-tertiary);
      font-size: 12px;
      text-align: center;
    }

    .no-files .hint {
      font-size: 11px;
      opacity: 0.7;
      margin-top: 4px;
    }

    .info-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .info-item {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .info-label {
      font-size: 11px;
      color: var(--color-text-tertiary);
    }

    .info-value {
      font-size: 12px;
      color: var(--color-text-secondary);
      word-break: break-all;
    }

    .info-value.truncate {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* Scrollbar styling */
    .file-list::-webkit-scrollbar {
      width: 4px;
    }

    .file-list::-webkit-scrollbar-track {
      background: transparent;
    }

    .file-list::-webkit-scrollbar-thumb {
      background: rgba(155, 155, 155, 0.3);
      border-radius: 4px;
    }
  </style>
</body>
</html>
