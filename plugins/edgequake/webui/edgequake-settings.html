<html>
<head>
  <title>EdgeQuake Settings</title>
  <script type="module">
    import { store } from "/plugins/edgequake/webui/edgequake-settings-store.js";
  </script>
</head>

<body>
<div x-data>
  <template x-if="$store.edgequakeSettings">
    <div
      x-create="$store.edgequakeSettings.load()"
      x-destroy="$store.edgequakeSettings.destroy()"
    >
      <div class="section">
        <div class="section-title">Connection</div>
        <div class="section-description">
          Connect to an EdgeQuake server for knowledge graph-powered RAG.
        </div>

        <!-- Server URL -->
        <div class="field">
          <div class="field-label">
            <div class="field-title">Server URL</div>
            <div class="field-description">Base URL of the EdgeQuake server</div>
          </div>
          <div class="field-control">
            <input
              type="text"
              x-model="$store.edgequakeSettings.base_url"
              placeholder="http://host.docker.internal:8080"
            />
          </div>
        </div>

        <!-- API Key -->
        <div class="field">
          <div class="field-label">
            <div class="field-title">API Key</div>
            <div class="field-description">Shared secret between this plugin and the EdgeQuake server</div>
          </div>
          <div class="field-control eq-api-key-field">
            <input
              :type="$store.edgequakeSettings.show_api_key ? 'text' : 'password'"
              x-model="$store.edgequakeSettings.api_key"
              placeholder="Enter or generate API key"
              autocomplete="off"
            />
            <button
              class="eq-icon-btn"
              @click="$store.edgequakeSettings.show_api_key = !$store.edgequakeSettings.show_api_key"
              title="Toggle visibility"
            >
              <span class="material-symbols-outlined" x-text="$store.edgequakeSettings.show_api_key ? 'visibility_off' : 'visibility'"></span>
            </button>
            <button
              class="eq-icon-btn eq-generate-btn"
              @click="$store.edgequakeSettings.generateKey()"
              title="Generate random API key"
            >
              <span class="material-symbols-outlined">casino</span>
            </button>
          </div>
        </div>

        <!-- Workspace ID -->
        <div class="field">
          <div class="field-label">
            <div class="field-title">Workspace ID</div>
            <div class="field-description">Optional workspace for multi-tenant setups</div>
          </div>
          <div class="field-control">
            <input
              type="text"
              x-model="$store.edgequakeSettings.workspace_id"
              placeholder="(optional)"
            />
          </div>
        </div>

        <!-- Tenant ID -->
        <div class="field">
          <div class="field-label">
            <div class="field-title">Tenant ID</div>
            <div class="field-description">Optional tenant for multi-tenant setups</div>
          </div>
          <div class="field-control">
            <input
              type="text"
              x-model="$store.edgequakeSettings.tenant_id"
              placeholder="(optional)"
            />
          </div>
        </div>

        <!-- Timeout -->
        <div class="field">
          <div class="field-label">
            <div class="field-title">Timeout</div>
            <div class="field-description">Request timeout in seconds</div>
          </div>
          <div class="field-control">
            <input
              type="number"
              x-model.number="$store.edgequakeSettings.timeout"
              min="5"
              max="300"
            />
          </div>
        </div>
      </div>

      <!-- Server Status -->
      <div class="section">
        <div class="section-title">Server</div>
        <div class="section-description">
          EdgeQuake server status (detected via health endpoint).
        </div>

        <!-- Status row (always shown) -->
        <div class="eq-server-row">
          <div class="eq-server-status">
            <!-- Running -->
            <template x-if="$store.edgequakeSettings.server_running && !$store.edgequakeSettings.server_starting">
              <div class="eq-status">
                <span class="eq-dot eq-dot-green"></span>
                <span>Running</span>
              </div>
            </template>
            <!-- Starting (Docker auto-start in progress) -->
            <template x-if="$store.edgequakeSettings.server_starting">
              <div class="eq-status">
                <span class="eq-dot eq-dot-yellow"></span>
                <span>Starting...</span>
              </div>
            </template>
            <!-- Not detected -->
            <template x-if="!$store.edgequakeSettings.server_running && !$store.edgequakeSettings.server_starting">
              <div class="eq-status">
                <span class="eq-dot eq-dot-red"></span>
                <span>Not detected</span>
              </div>
            </template>
          </div>

          <!-- Docker auto-management buttons (only when Docker SDK is available) -->
          <template x-if="$store.edgequakeSettings.docker_available">
            <div class="eq-server-row">
              <button
                class="btn btn-ok"
                x-show="!$store.edgequakeSettings.server_running && !$store.edgequakeSettings.server_starting"
                @click="$store.edgequakeSettings.startServer()"
                :disabled="$store.edgequakeSettings.server_stopping"
              >Start Server</button>
              <button
                class="btn btn-cancel"
                x-show="$store.edgequakeSettings.server_running || $store.edgequakeSettings.server_starting"
                @click="$store.edgequakeSettings.stopServer()"
                :disabled="$store.edgequakeSettings.server_stopping"
              >
                <span x-show="$store.edgequakeSettings.server_stopping">Stopping...</span>
                <span x-show="!$store.edgequakeSettings.server_stopping">Stop Server</span>
              </button>
            </div>
          </template>

          <!-- Refresh status -->
          <button
            class="eq-icon-btn"
            @click="$store.edgequakeSettings.checkServerStatus()"
            title="Refresh status"
          >
            <span class="material-symbols-outlined">refresh</span>
          </button>
        </div>

        <!-- Error message -->
        <div class="eq-server-error" x-show="$store.edgequakeSettings.server_error" x-text="$store.edgequakeSettings.server_error"></div>

        <!-- Manual launch instructions (when Docker auto-management is not available) -->
        <div class="eq-server-manual" x-show="!$store.edgequakeSettings.docker_available && !$store.edgequakeSettings.server_running">
          <div class="eq-manual-title">Save settings first, then run on your host machine:</div>
          <pre class="eq-manual-cmd" @click="navigator.clipboard.writeText('cd plugins/edgequake/docker && docker compose up -d --build')"><code>cd plugins/edgequake/docker &amp;&amp; docker compose up -d --build</code></pre>
          <div class="eq-manual-hint">Click to copy. Save writes a .env file with your API key and LLM config (auto-read from Agent Zero settings). First build takes 10-30 min. Then refresh status above.</div>
        </div>
      </div>

      <!-- Pipeline Settings -->
      <div class="section">
        <div class="section-title">Pipeline</div>
        <div class="section-description">
          Automatic conversation indexing and knowledge recall. Both are disabled by default.
        </div>

        <!-- Auto Index -->
        <div class="field">
          <div class="field-label">
            <div class="field-title">Auto-Index Conversations</div>
            <div class="field-description">Automatically upload conversation turns to EdgeQuake for knowledge graph indexing</div>
          </div>
          <div class="field-control">
            <label class="toggle">
              <input type="checkbox" x-model="$store.edgequakeSettings.auto_index" />
              <span class="toggler"></span>
            </label>
          </div>
        </div>

        <!-- Index Batch Size -->
        <div class="field" x-show="$store.edgequakeSettings.auto_index">
          <div class="field-label">
            <div class="field-title">Index Batch Size</div>
            <div class="field-description">Number of conversation turns to buffer before uploading</div>
          </div>
          <div class="field-control">
            <input
              type="number"
              x-model.number="$store.edgequakeSettings.index_batch_size"
              min="1"
              max="50"
            />
          </div>
        </div>

        <!-- Auto Recall -->
        <div class="field">
          <div class="field-label">
            <div class="field-title">Auto-Recall Knowledge</div>
            <div class="field-description">Automatically query the knowledge graph to enrich agent context before each response</div>
          </div>
          <div class="field-control">
            <label class="toggle">
              <input type="checkbox" x-model="$store.edgequakeSettings.auto_recall" />
              <span class="toggler"></span>
            </label>
          </div>
        </div>

        <!-- Recall Timeout -->
        <div class="field" x-show="$store.edgequakeSettings.auto_recall">
          <div class="field-label">
            <div class="field-title">Recall Timeout</div>
            <div class="field-description">Maximum seconds to wait for knowledge graph query (prevents blocking)</div>
          </div>
          <div class="field-control">
            <input
              type="number"
              x-model.number="$store.edgequakeSettings.recall_timeout"
              min="1"
              max="30"
            />
          </div>
        </div>
      </div>

      <!-- Test Connection -->
      <div class="section">
        <div class="section-title">Connection Test</div>
        <div class="eq-test-row">
          <button
            class="btn btn-ok"
            @click="$store.edgequakeSettings.testConnection()"
            :disabled="$store.edgequakeSettings.connection_status === 'testing'"
          >
            <span
              x-show="$store.edgequakeSettings.connection_status === 'testing'"
              class="material-symbols-outlined spinning"
            >progress_activity</span>
            <span x-show="$store.edgequakeSettings.connection_status !== 'testing'">Test Connection</span>
            <span x-show="$store.edgequakeSettings.connection_status === 'testing'">Testing...</span>
          </button>

          <!-- Status indicator -->
          <div class="eq-status" x-show="$store.edgequakeSettings.connection_status === 'connected'">
            <span class="eq-dot eq-dot-green"></span>
            <span x-text="$store.edgequakeSettings.connection_info"></span>
          </div>
          <div class="eq-status" x-show="$store.edgequakeSettings.connection_status === 'error'">
            <span class="eq-dot eq-dot-red"></span>
            <span x-text="$store.edgequakeSettings.connection_info"></span>
          </div>
        </div>
      </div>

      <!-- Footer -->
      <div class="modal-footer" data-modal-footer>
        <button
          class="btn btn-ok"
          @click="$store.edgequakeSettings.save()"
          :disabled="$store.edgequakeSettings.loading"
        >Save</button>
        <button
          class="btn btn-cancel"
          @click="window.closeModal('../plugins/edgequake/webui/edgequake-settings.html')"
        >Cancel</button>
      </div>
    </div>
  </template>
</div>

<style>
/* API key field with icon buttons */
.eq-api-key-field {
  position: relative;
  display: flex;
  align-items: center;
  gap: 0;
}

.eq-api-key-field input {
  padding-right: 4.5rem;
  flex: 1;
}

.eq-icon-btn {
  background: none;
  border: none;
  cursor: pointer;
  color: var(--color-text);
  opacity: 0.6;
  padding: 0.25rem;
  display: flex;
  align-items: center;
}

.eq-icon-btn:hover {
  opacity: 1;
}

.eq-api-key-field .eq-icon-btn {
  position: absolute;
  top: 50%;
  transform: translateY(-50%);
}

.eq-api-key-field .eq-icon-btn:first-of-type {
  right: 2rem;
}

.eq-api-key-field .eq-generate-btn {
  right: 0.25rem;
}

/* Test connection row */
.eq-test-row {
  display: flex;
  align-items: center;
  gap: 1rem;
  flex-wrap: wrap;
}

/* Shared status indicator */
.eq-status {
  display: flex;
  align-items: center;
  gap: 0.5rem;
  font-size: 0.875rem;
  color: var(--color-text);
}

.eq-dot {
  width: 10px;
  height: 10px;
  border-radius: 50%;
  display: inline-block;
  flex-shrink: 0;
}

.eq-dot-green {
  background-color: #27ae60;
}

.eq-dot-red {
  background-color: #e74c3c;
}

.eq-dot-yellow {
  background-color: #f39c12;
  animation: pulse 1.5s ease-in-out infinite;
}

/* Server management section */
.eq-server-row {
  display: flex;
  align-items: center;
  gap: 0.75rem;
  flex-wrap: wrap;
}

.eq-server-status {
  min-width: 100px;
}

.eq-server-notice {
  display: flex;
  align-items: center;
  gap: 0.5rem;
  padding: 0.75rem;
  background: rgba(243, 156, 18, 0.1);
  border: 1px solid rgba(243, 156, 18, 0.3);
  border-radius: 6px;
  font-size: 0.875rem;
  color: var(--color-text);
}

.eq-server-notice .material-symbols-outlined {
  font-size: 1.1rem;
  color: #f39c12;
}

.eq-server-error {
  margin-top: 0.5rem;
  padding: 0.5rem 0.75rem;
  background: rgba(231, 76, 60, 0.1);
  border: 1px solid rgba(231, 76, 60, 0.3);
  border-radius: 6px;
  font-size: 0.8rem;
  color: #e74c3c;
}

.eq-server-manual {
  margin-top: 0.75rem;
  padding: 0.75rem;
  background: var(--color-input);
  border-radius: 6px;
}

.eq-manual-title {
  font-size: 0.8rem;
  opacity: 0.7;
  margin-bottom: 0.5rem;
  color: var(--color-text);
}

.eq-manual-cmd {
  background: var(--color-background);
  padding: 0.75rem;
  border-radius: 4px;
  font-size: 0.8rem;
  overflow-x: auto;
  cursor: pointer;
  border: 1px solid var(--color-border);
  margin: 0;
  color: var(--color-text);
  line-height: 1.5;
  white-space: pre-wrap;
  word-break: break-all;
}

.eq-manual-cmd:hover {
  border-color: var(--color-accent);
}

.eq-manual-cmd code {
  font-family: inherit;
}

.eq-manual-hint {
  font-size: 0.75rem;
  opacity: 0.5;
  margin-top: 0.4rem;
  color: var(--color-text);
}

/* Animations */
.spinning {
  animation: spin 1s linear infinite;
  font-size: 1rem;
}

@keyframes spin {
  from { transform: rotate(0deg); }
  to { transform: rotate(360deg); }
}

@keyframes pulse {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.4; }
}
</style>
</body>
</html>
