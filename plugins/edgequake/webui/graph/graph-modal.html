<html>
<head>
  <title>EdgeQuake Knowledge Graph</title>
  <script type="module">
    import { store } from "/plugins/edgequake/webui/graph/graph-store.js";
  </script>
</head>

<body>
<div x-data>
  <template x-if="$store.edgequakeGraph">
    <div
      x-create="$store.edgequakeGraph.loadStats()"
      x-destroy="$store.edgequakeGraph.destroy()"
      class="eq-graph"
    >
      <!-- Error banner -->
      <div class="eq-error" x-show="$store.edgequakeGraph.errorMessage" x-text="$store.edgequakeGraph.errorMessage"></div>

      <!-- Stats overview -->
      <div class="section" x-show="$store.edgequakeGraph.stats">
        <div class="section-title">Graph Overview</div>
        <div class="eq-stats-row">
          <div class="eq-stat">
            <span class="eq-stat-value" x-text="$store.edgequakeGraph.stats?.entity_count || 0"></span>
            <span class="eq-stat-label">Entities</span>
          </div>
          <div class="eq-stat">
            <span class="eq-stat-value" x-text="$store.edgequakeGraph.stats?.relationship_count || 0"></span>
            <span class="eq-stat-label">Relationships</span>
          </div>
        </div>
        <div class="eq-labels" x-show="$store.edgequakeGraph.stats?.labels?.length > 0">
          <span class="eq-label-title">Labels:</span>
          <template x-for="label in ($store.edgequakeGraph.stats?.labels || []).slice(0, 20)" :key="label">
            <span class="eq-label-tag" x-text="label"></span>
          </template>
        </div>
      </div>

      <!-- Search -->
      <div class="section">
        <div class="section-title">Entity Search</div>
        <div class="eq-search-row">
          <input
            type="text"
            class="eq-search-input"
            x-model="$store.edgequakeGraph.searchKeyword"
            placeholder="Search entities..."
            @keyup.enter="$store.edgequakeGraph.search()"
          />
          <button
            class="btn btn-ok"
            @click="$store.edgequakeGraph.search()"
            :disabled="$store.edgequakeGraph.searching || !$store.edgequakeGraph.searchKeyword.trim()"
          >
            <span x-show="!$store.edgequakeGraph.searching">Search</span>
            <span x-show="$store.edgequakeGraph.searching">Searching...</span>
          </button>
        </div>
      </div>

      <!-- Results -->
      <div class="section" x-show="$store.edgequakeGraph.entities.length > 0 || $store.edgequakeGraph.searching || $store.edgequakeGraph.hasSearched">
        <div class="section-title">Results</div>

        <div class="eq-loading" x-show="$store.edgequakeGraph.searching">Searching...</div>

        <div class="eq-entity-list" x-show="!$store.edgequakeGraph.searching">
          <template x-for="(entity, idx) in $store.edgequakeGraph.entities" :key="idx">
            <div class="eq-entity-card" :class="{'eq-entity-selected': $store.edgequakeGraph.selectedIndex === idx}"
                 @click="$store.edgequakeGraph.selectEntity(idx)">
              <div class="eq-entity-header">
                <span class="eq-entity-name" x-text="entity.name"></span>
                <span class="eq-entity-type" x-show="entity.entity_type" x-text="entity.entity_type"></span>
              </div>
              <div class="eq-entity-desc" x-show="entity.description" x-text="entity.description"></div>

              <!-- Relationships (shown when selected) -->
              <div class="eq-entity-rels" x-show="$store.edgequakeGraph.selectedIndex === idx && entity.relationships && entity.relationships.length > 0">
                <div class="eq-rels-title">Relationships</div>
                <template x-for="(rel, ridx) in (entity.relationships || [])" :key="ridx">
                  <div class="eq-rel-row">
                    <span class="eq-rel-source" x-text="rel.source"></span>
                    <span class="eq-rel-arrow">&rarr;</span>
                    <span class="eq-rel-type" x-text="rel.relationship"></span>
                    <span class="eq-rel-arrow">&rarr;</span>
                    <span class="eq-rel-target" x-text="rel.target"></span>
                  </div>
                </template>
              </div>
            </div>
          </template>
        </div>

        <div class="eq-empty" x-show="!$store.edgequakeGraph.searching && $store.edgequakeGraph.entities.length === 0 && $store.edgequakeGraph.hasSearched">
          No entities found.
        </div>
      </div>

      <!-- Footer -->
      <div class="modal-footer" data-modal-footer>
        <button class="btn btn-cancel" @click="window.closeModal('../plugins/edgequake/webui/graph/graph-modal.html')">Close</button>
      </div>
    </div>
  </template>
</div>

<style>
.eq-graph {
  display: flex;
  flex-direction: column;
  gap: var(--spacing-md, 1rem);
}

.eq-error {
  background: rgba(231, 76, 60, 0.15);
  color: #e74c3c;
  padding: 0.75rem 1rem;
  border-radius: 6px;
  font-size: 0.875rem;
}

.eq-stats-row {
  display: flex;
  gap: 2rem;
  margin-bottom: 0.75rem;
}

.eq-stat {
  display: flex;
  flex-direction: column;
}

.eq-stat-value {
  font-size: 1.5rem;
  font-weight: 700;
  color: var(--color-primary, #7c8cff);
}

.eq-stat-label {
  font-size: 0.75rem;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  opacity: 0.6;
  color: var(--color-text, #aaa);
}

.eq-labels {
  display: flex;
  flex-wrap: wrap;
  gap: 0.375rem;
  align-items: center;
}

.eq-label-title {
  font-size: 0.75rem;
  opacity: 0.6;
  color: var(--color-text, #aaa);
  margin-right: 0.25rem;
}

.eq-label-tag {
  display: inline-block;
  padding: 0.1rem 0.5rem;
  border-radius: 10px;
  font-size: 0.7rem;
  background: var(--color-input, rgba(255,255,255,0.08));
  color: var(--color-text, #ccc);
}

.eq-search-row {
  display: flex;
  gap: 0.5rem;
}

.eq-search-input {
  flex: 1;
  background: var(--color-input, #1a1a2e);
  border: 1px solid var(--color-border, #333);
  border-radius: 6px;
  padding: 0.5rem 0.75rem;
  color: var(--color-text, #eee);
  font-size: 0.875rem;
}

.eq-loading, .eq-empty {
  color: var(--color-text, #aaa);
  opacity: 0.7;
  padding: 1rem 0;
  font-size: 0.875rem;
}

.eq-entity-list {
  display: flex;
  flex-direction: column;
  gap: 0.5rem;
}

.eq-entity-card {
  background: var(--color-input, rgba(255,255,255,0.04));
  border: 1px solid var(--color-border, #333);
  border-radius: 8px;
  padding: 0.75rem 1rem;
  cursor: pointer;
  transition: border-color var(--transition-speed, 0.3s) ease;
}

.eq-entity-card:hover {
  border-color: var(--color-accent, #7c8cff);
}

.eq-entity-selected {
  border-color: var(--color-accent, #7c8cff);
  background: rgba(124, 140, 255, 0.06);
}

.eq-entity-header {
  display: flex;
  align-items: center;
  gap: 0.5rem;
}

.eq-entity-name {
  font-weight: 600;
  color: var(--color-text, #eee);
}

.eq-entity-type {
  font-size: 0.7rem;
  padding: 0.1rem 0.4rem;
  border-radius: 8px;
  background: rgba(124, 140, 255, 0.15);
  color: var(--color-accent, #7c8cff);
}

.eq-entity-desc {
  margin-top: 0.375rem;
  font-size: 0.8rem;
  color: var(--color-text, #aaa);
  opacity: 0.8;
  line-height: 1.4;
}

.eq-entity-rels {
  margin-top: 0.75rem;
  padding-top: 0.5rem;
  border-top: 1px solid var(--color-border, #333);
}

.eq-rels-title {
  font-size: 0.7rem;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  opacity: 0.6;
  margin-bottom: 0.375rem;
  color: var(--color-text, #aaa);
}

.eq-rel-row {
  display: flex;
  align-items: center;
  gap: 0.375rem;
  font-size: 0.8rem;
  padding: 0.2rem 0;
  color: var(--color-text, #ccc);
}

.eq-rel-arrow {
  opacity: 0.4;
  font-size: 0.75rem;
}

.eq-rel-type {
  font-style: italic;
  opacity: 0.7;
}
</style>
</body>
</html>
