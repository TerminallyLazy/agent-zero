<div x-data="{ eqDropdownOpen: false }">
  <div
    x-move-after=".config-button#dashboard"
    class="config-button eq-sidebar-wrapper"
    id="edgequake"
  >
    <button
      class="eq-sidebar-btn"
      @click="eqDropdownOpen = !eqDropdownOpen"
      title="EdgeQuake Knowledge Graph"
    >
      <span class="material-symbols-outlined">hub</span>
    </button>

    <!-- Dropdown menu -->
    <div
      class="eq-dropdown"
      x-show="eqDropdownOpen"
      @click.outside="eqDropdownOpen = false"
      @keydown.escape.window="eqDropdownOpen = false"
      x-transition
    >
      <button class="eq-dropdown-item" @click="openModal('../plugins/edgequake/webui/edgequake-settings.html'); eqDropdownOpen = false">
        <span class="material-symbols-outlined">settings</span>
        <span>Settings</span>
      </button>
      <button class="eq-dropdown-item" @click="openModal('../plugins/edgequake/webui/documents/documents-modal.html'); eqDropdownOpen = false">
        <span class="material-symbols-outlined">description</span>
        <span>Documents</span>
      </button>
      <button class="eq-dropdown-item" @click="openModal('../plugins/edgequake/webui/graph/graph-modal.html'); eqDropdownOpen = false">
        <span class="material-symbols-outlined">account_tree</span>
        <span>Graph Explorer</span>
      </button>
      <button class="eq-dropdown-item" @click="openModal('../plugins/edgequake/webui/query/query-modal.html'); eqDropdownOpen = false">
        <span class="material-symbols-outlined">search</span>
        <span>Query</span>
      </button>
    </div>
  </div>
</div>

<style>
.eq-sidebar-wrapper {
  position: relative;
}

.eq-sidebar-btn {
  background: none;
  border: none;
  cursor: pointer;
  color: inherit;
  padding: 0;
  display: flex;
  align-items: center;
  justify-content: center;
}

.eq-dropdown {
  position: absolute;
  left: calc(100% + 8px);
  top: 50%;
  transform: translateY(-50%);
  background: var(--color-panel, #1e1e2e);
  border: 1px solid var(--color-border, #333);
  border-radius: 8px;
  padding: 0.375rem;
  min-width: 160px;
  z-index: 100;
  box-shadow: 0 4px 16px rgba(0, 0, 0, 0.3);
}

.eq-dropdown-item {
  display: flex;
  align-items: center;
  gap: 0.5rem;
  width: 100%;
  padding: 0.5rem 0.625rem;
  border: none;
  background: none;
  color: var(--color-text, #ccc);
  font-size: 0.8rem;
  cursor: pointer;
  border-radius: 6px;
  text-align: left;
  white-space: nowrap;
  transition: background var(--transition-speed, 0.3s) ease;
}

.eq-dropdown-item:hover {
  background: var(--color-input, rgba(255,255,255,0.08));
}

.eq-dropdown-item .material-symbols-outlined {
  font-size: 1.1rem;
  opacity: 0.7;
}
</style>
