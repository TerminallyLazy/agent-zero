[server]
host = "127.0.0.1"
port = 50001

[observability]
log_format = "pretty"
log_level = "info"

[bridge]
mode = "null"
base_url = "http://127.0.0.1:50001"
api_key = ""
timeout_secs = 30

[security]
auth_mode = "reserved"
csrf_mode = "reserved"
allowed_origins = ["http://localhost:50001"]

[ui]
# Optional override. Leave commented to let the binary auto-discover
# either an installed share directory or the repository's webui/ folder.
# asset_root = "/absolute/path/to/webui"
